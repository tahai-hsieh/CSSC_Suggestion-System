<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺北藝術大學師資培育中心甄選題庫系統</title>
    <style>
        /* 整份試卷設定為標楷體 */
        * {
            font-family: "標楷體", "DFKai-SB", "BiauKai", serif;
        }

        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            line-height: 1.6; 
            margin: 0; 
            padding: 20px; 
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* 標題調整：縮小字體並確保盡可能在同一行 */
        h1 { 
            text-align: center; 
            color: #ffffff; 
            margin-bottom: 40px; 
            font-size: 1.6rem; /* 縮小字體 */
            letter-spacing: 1px;
            white-space: nowrap; /* 強制不換行 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 行動裝置適應：如果螢幕太窄還是允許換行以免字體溢出 */
        @media (max-width: 600px) {
            h1 { 
                white-space: normal; 
                font-size: 1.3rem;
            }
        }

        .quiz-card { 
            background-color: #1e1e1e; 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
            position: relative;
        }

        .quiz-card.marked { 
            border-left: 8px solid #ffab40; 
            background-color: #252525;
        }

        .question { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-bottom: 20px; 
            display: block; 
            padding-right: 80px; 
        }
        
        .options-group { display: flex; flex-direction: column; gap: 12px; }

        .option-label { 
            display: flex; 
            align-items: center; 
            padding: 14px; 
            background-color: #2c2c2c; 
            border: 2px solid transparent; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 1.1rem;
        }
        .option-label:hover { background-color: #383838; }
        .option-label input { margin-right: 15px; transform: scale(1.2); cursor: pointer; }
        
        .option-label.selected { 
            border-color: #bb86fc; 
            background-color: #332940; 
        }

        .mark-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: 1px solid #666;
            color: #aaa;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .mark-btn.active { 
            background-color: #ffab40; 
            color: #000; 
            border-color: #ffab40; 
            font-weight: bold;
        }

        .result-box { margin-top: 20px; padding: 18px; border-radius: 8px; display: none; font-size: 1.05rem; }
        .correct-box { background-color: #1b5e20; color: #c8e6c9; border: 1px solid #2e7d32; }
        .wrong-box { background-color: #b71c1c; color: #ffcdd2; border: 1px solid #d32f2f; }
        .ans-header { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; display: block; }

        .action-area { text-align: center; margin: 50px 0; }
        .btn {
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
        }
        .submit-btn { background-color: #03dac6; color: #000; }
        .submit-btn:hover { background-color: #018786; transform: translateY(-2px); }
        .reset-btn { background-color: #cf6679; color: #fff; display: none; }

        #summary-panel {
            background-color: #1e1e1e;
            border: 3px solid #bb86fc;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            display: none;
            margin-bottom: 80px;
            box-shadow: 0 0 20px rgba(187, 134, 252, 0.3);
        }
        #score-title { font-size: 1.8rem; color: #03dac6; font-weight: bold; margin-bottom: 15px; }
        #summary-msg { font-size: 1.2rem; color: #ffffff; }

        input:disabled + span { color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>國立臺北藝術大學師資培育中心甄選題庫系統（114-116）</h1>

    <div id="quiz-list"></div>

    <div class="action-area">
        <button id="submit-all" class="btn submit-btn" onclick="submitQuiz()">送出試卷</button>
        <button id="reset-all" class="btn reset-btn" onclick="resetQuiz()">重新開始測驗</button>
    </div>

    <div id="summary-panel">
        <div id="score-title"></div>
        <div id="summary-msg"></div>
    </div>
</div>

<script>
    const quizData = [
        { q: "為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？", o: ["3 月 19 日", "4 月 20 日", "5 月 21 日", "6 月 22 日"], a: 1, r: "為紀念葉永鋕事件並推動性別平等教育，教育部將此日訂為性別平等教育日。" },
        { q: "近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？", o: ["建構韌性防災校園與防災科技資源應用計畫", "2030 雙語國家政策計畫", "推動中小學數位學習精進方案", "建構合作共享的校園圖書館系統中長程計畫"], a: 2, r: "此方案即所謂的「班班有網路，生生用平板」，重點在於數位學習資源與硬體的充實。" },
        { q: "十二年國教新課綱提到的「跨領域統整課程」是指什麼？", o: ["由不同學科的老師共同教授同一門部定必修課程", "打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習", "學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的課程", "除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。"], a: 1, r: "跨領域統整的核心在於串連不同學門知識，幫助學生進行整合性學習。" },
        { q: "為了推動台灣成為雙語國家，教育部規劃多項措施以平衡偏鄉雙語教育資源不足的問題。請問下列的措施何者為非？", o: ["開出誘因引進雙語師資陣容", "與民間機構合作伴讀計畫", "讓孩子順其自然學習", "運用數位學習平台。"], a: 2, r: "政府需有具體介入與支持措施，而非放任「順其自然」。" },
        { q: "近幾年由於青少年偏差行為、憂鬱傾向、自我傷害事件案例日益增多，教育部正努力推動何種教育措施？", o: ["生命教育", "民主教育", "道德教育", "人權教育。"], a: 0, r: "生命教育旨在引導學生探索生命意義，並建立自尊、自愛與情緒調適能力。" },
        { q: "在班級經營時，教師不宜運用下列哪一種肢體語言？", o: ["運用身體姿勢以傳達教師的情緒", "運用眼神接觸，提醒聊天的同學停止說話", "走近不專心的同學，讓其注意力集中於課業", "經常碰觸學生身體以表示親切。"], a: 3, r: "頻繁的肢體接觸容易引發性別或權力界限的爭議。" },
        { q: "下列何者不屬於最新修訂之實驗教育三法？", o: ["《學校型態實驗教育實施條例》", "《高級中等以下教育階段非學校型態實驗教育實施條例》", "《公立高級中等以下學校委託私人辦理實驗教育條例》", "《高級中等學校教育實驗辦法》"], a: 3, r: "此為較早期的個別辦法，不屬於目前通稱的實驗教育三法條例。" },
        { q: "依據「兒童及少年福利法」第34條規定，教師知悉有遭受身心虐待之情事者，應立即向直轄市、縣(市)主管機關通報，至遲不得超過多久?", o: ["24小時", "36小時", "48小時", "72小時。"], a: 0, r: "法規要求知悉虐待案件必須在24小時內完成責任通報。" },
        { q: "依據師資培育法之規定，為培育教師任教學科、領域、群科專長之專門知能課程，屬於下列何者的定義？", o: ["專門課程", "教育專業課程", "普通課程", "師資職前教育課程。"], a: 0, r: "專門課程即是指針對未來任教科目（如數學、國文）的本學科專業知識學習。" },
        { q: "孩子王阿布要求班上的同學都不可以與他討厭的同學阿達互動。阿布的做法屬於？", o: ["網路霸應", "肢體霸凌", "言語霸凌", "關係霸凌"], a: 3, r: "關係霸凌是指透過排擠或操弄人際關係來孤立他人。" },
        { q: "翻轉教室（Flipped Classroom）最主要的理念為何？", o: ["翻轉程度落差", "翻轉知識藩籬", "翻轉資源落差", "翻轉學習順序，讓學生先在家看資料，再來課堂討論。"], a: 3, r: "強調「家裡聽講、教室寫作業」，反轉傳統教學流程。" },
        { q: "教育部公佈終身學習的教師圖像分為三大向度，下列何者不是？", o: ["教育愛", "專業力", "未來力", "創新力。"], a: 3, r: "官方定義為：教育愛、專業力、未來力。" },
        { q: "自107年開始，教育實習相關規定何者正確？", o: ["師資生必須通過教師資格檢定考後使得參與教育實習", "修畢課程即可實習", "成績由實習機構評定", "以上皆非。"], a: 0, r: "自107年起改為「先考後實習」制。" },
        { q: "下列何者不是師資培育中心的學生取得教師證書之途徑？", o: ["修畢師資職前教育課程", "通過教師甄試", "通過教師資格檢定考試", "修畢教育實習課程。"], a: 1, r: "教師甄試是為了取得「教職」，非取得「教師證書」。" },
        { q: "我國零體罰明訂在下列哪項法規中？", o: ["教師法", "兒童及少年福利法", "師資培育法", "教育基本法。"], a: 3, r: "2006年修正《教育基本法》，明文保障學生不受體罰。" },
        { q: "補救教學的主要目的為何？", o: ["強化多元文化", "促進教育機會均等", "提供就業機會", "提升菁英教育。"], a: 1, r: "確保基礎學習目標的達成，縮減學習落差。" },
        { q: "實習學生擔任特定教學活動（補救教學等）之每週總節數上限為？", o: ["6", "8", "10", "12"], a: 2, r: "法規規定實習學生擔任特定教學活動上限為10節。" },
        { q: "有關我國目前十二年國教敘述，下列何者正確？", o: ["全面免學費", "分兩階段，國中小與高中職各有其法源。", "全面免試", "強迫入學至高中"], a: 1, r: "正確描述了現行國教在法源上的階段性區分。" },
        { q: "關於教師期望（比馬龍效應）何者正確？", o: ["期望要低標", "要瞭解學生，小心運用自我應驗預言。", "參與少導致期望高", "保證自我概念良好"], a: 1, r: "自我應驗預言具備強大影響力，教師需謹慎運用。" },
        { q: "哪種研究方法最適合教師解決具體教學問題？", o: ["實驗法", "訪談法", "行動研究法", "問卷法。"], a: 2, r: "行動研究強調「發現問題、採取行動、反思修正」。" },
        { q: "依據性別平等教育法，下列敘述何者錯誤？", o: ["教材應多元", "應利用空白課程進行性平教育", "不得因性別有差別待遇", "每學期至少四小時。"], a: 1, r: "性平教育應融入課程，不應只依賴空白課程。" },
        { q: "重視新移民原生文化展現多元精神，是在落實？", o: ["教育機會均等", "社會化", "社會階層化", "選擇與分配。"], a: 0, r: "透過文化認同促進教育場域的公平與尊嚴。" },
        { q: "根據《教師法》，下列何者「不是」教師的義務？", o: ["擔任導師", "參加教師組織", "維護學生受教權益", "從事研究進修。"], a: 1, r: "參加教師組織是教師的「權利」。" },
        { q: "「2030 雙語國家」政策藍圖中，「不包括」哪一項？", o: ["延伸至幼兒園", "中小學各學科英語授課", "英語科全英語授課", "推動雙聯學位。"], a: 1, r: "並非所有學科都全英，而是部分學科推動雙語。" },
        { q: "家長現在最重視的議題是？", o: ["親子關係", "品格教育", "心理健康", "成績課業。"], a: 1, r: "品格教育（價值觀）始終是家長最關注的首位。" },
        { q: "關於學校本位課程的陳述，何者為非?", o: ["學校自主改革", "由中央統籌指導", "發揮學校特色", "結合社區發展。"], a: 1, r: "校本課程強調學校自主與彈性。" },
        { q: "教師主動學習新教學法並應用，符合哪個圖像向度？", o: ["教育愛", "專業力", "未來力", "批判力。"], a: 2, r: "未來力代表應對變遷與持續精進的能力。" },
        { q: "AI 科技在教育中的角色是？", o: ["取代教師", "提供標準化材料", "限制創意", "輔助教育者提供彈性環境。"], a: 3, r: "AI 是輔助適性學習的強力工具。" },
        { q: "台灣雙語教育期待英文教師扮演的角色，何者有誤？", o: ["專業發展者", "同步翻譯者", "經驗分享者", "專業陪伴者。"], a: 1, r: "同步翻譯會降低學生主動聆聽英語的意願。" },
        { q: "輔導工作原則，下列哪個最不適切？", o: ["導師需負責", "不應獨立於教學外", "科任老師也需負責", "主要工作為學習輔導。"], a: 3, r: "輔導涵蓋生活與心理等多面向，非僅限學習。" },
        { q: "課程、教材與教科書關係何者有誤?", o: ["教材是課程一部分", "教科書和教材互不包含", "教師簡報屬教材", "教材反映目標。"], a: 1, r: "教科書是教材中最核心的類型。" },
        { q: "最新《校園霸凌防制準則》，何者有誤？", o: ["霸凌指持續貶抑行為", "24小時內通報", "師對生亦屬「校園霸凌」定義", "可申請調查。"], a: 2, r: "新版已區分「師對生不當對待」與「學生間霸凌」。" },
        { q: "高中無故缺課連三日以上稱為？", o: ["中輟生", "中離生", "長缺生", "不明生。"], a: 1, r: "高中階段法定名稱為「中途離校學生」。" },
        { q: "比較兩班不同教學策略成效的研究屬於？", o: ["實驗法", "研究法", "相關法", "描述法。"], a: 0, r: "這是典型的實驗設計研究。" },
        { q: "我國「六三三」學制主要仿效？", o: ["日本", "美國", "英國", "德國。"], a: 1, r: "台灣近代學制深受美國系統影響。" },
        { q: "偏鄉會考成績偏低涉及什麼議題？", o: ["終身學習", "教師專業", "教育機會均等", "家長選擇權。"], a: 2, r: "資源落差導致的結果不平等是核心議題。" },
        { q: "台灣雙語教育推動重點何者有誤？", o: ["校長率先雙語", "英語打底後接受雙語", "學科可以國語授課", "理想是英文老師教專科。"], a: 3, r: "應是「學科老師具備英語力」才是核心方向。" },
        { q: "實習學生教學節數應為專任教師基本節數的？", o: ["1/4~1/2", "1/6~1/2", "1/8~1/2", "以上皆非。"], a: 1, r: "這是 107 年最新法規修訂之比例。" },
        { q: "雙語教育敘述何者正確？", o: ["採用國英雙語教學", "就是英語教學", "全套套用加拿大模式", "就是全英語教學。"], a: 0, r: "核心在於雙語言的共同應用。" },
        { q: "教師違反重大情事被「暫時停止」聘約稱為？", o: ["停聘", "解聘", "不續聘", "懸缺。"], a: 0, r: "停聘指聘約的中途暫停。" }
    ];

    const list = document.getElementById('quiz-list');

    function initQuiz() {
        list.innerHTML = '';
        quizData.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${i}`;
            
            let optionsHtml = '';
            item.o.forEach((opt, oi) => {
                optionsHtml += `
                    <label class="option-label" id="label-${i}-${oi}">
                        <input type="radio" name="q${i}" value="${oi}" onchange="selectOpt(${i}, ${oi})">
                        <span>${opt}</span>
                    </label>
                `;
            });

            card.innerHTML = `
                <button class="mark-btn" id="mark-${i}" onclick="toggleMark(${i})">標記題目</button>
                <div class="question">${i+1}. ${item.q}</div>
                <div class="options-group">${optionsHtml}</div>
                <div id="res-${i}" class="result-box"></div>
            `;
            list.appendChild(card);
        });
        document.getElementById('submit-all').style.display = 'inline-block';
        document.getElementById('reset-all').style.display = 'none';
        document.getElementById('summary-panel').style.display = 'none';
    }

    window.selectOpt = function(qi, oi) {
        for(let j=0; j<4; j++) {
            const lbl = document.getElementById(`label-${qi}-${j}`);
            if(lbl) lbl.classList.remove('selected');
        }
        document.getElementById(`label-${qi}-${oi}`).classList.add('selected');
    };

    window.toggleMark = function(i) {
        const btn = document.getElementById(`mark-${i}`);
        const card = document.getElementById(`card-${i}`);
        btn.classList.toggle('active');
        card.classList.toggle('marked');
        btn.innerText = btn.classList.contains('active') ? '已標記' : '標記題目';
    };

    window.submitQuiz = function() {
        if(!confirm('確定要送出試卷嗎？')) return;

        let correctCount = 0;
        quizData.forEach((item, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const resBox = document.getElementById(`res-${i}`);
            resBox.style.display = 'block';
            
            const inputs = document.getElementsByName(`q${i}`);
            inputs.forEach(inp => inp.disabled = true);

            if (selected && parseInt(selected.value) === item.a) {
                correctCount++;
                resBox.className = 'result-box correct-box';
                resBox.innerHTML = `<span class="ans-header">✅ 答對！</span>解析：${item.r}`;
            } else {
                resBox.className = 'result-box wrong-box';
                const userAns = selected ? item.o[selected.value] : "（未作答）";
                resBox.innerHTML = `
                    <span class="ans-header">❌ 答錯！</span>
                    正確答案：<u>${item.o[item.a]}</u><br>你的答案：${userAns}<br>
                    解析：${item.r}
                `;
            }
        });

        const summary = document.getElementById('summary-panel');
        summary.style.display = 'block';
        document.getElementById('score-title').innerText = `對題數：${correctCount} / 40`;
        document.getElementById('summary-msg').innerText = `謝佳杰，測驗已完成！正確率為 ${(correctCount/40*100).toFixed(0)}%。加油！（較建議此版本）`;

        document.getElementById('submit-all').style.display = 'none';
        document.getElementById('reset-all').style.display = 'inline-block';
        window.scrollTo({ top: summary.offsetTop - 50, behavior: 'smooth' });
    };

    window.resetQuiz = function() {
        if(confirm('重新開始？')) {
            initQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    initQuiz();
</script>

</body>
</html>
