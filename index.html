<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺北藝術大學師資培育中心甄選題庫系統（114-116）</title>
    <style>
        * { font-family: "標楷體", "DFKai-SB", "BiauKai", serif; box-sizing: border-box; }
        body { background-color: #121212; color: #e0e0e0; line-height: 1.6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 850px; }
        .nav-bar { background-color: #303f9f; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nav-item { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; cursor: pointer; position: relative; background-color: #fff; color: #303f9f; transition: 0.2s; border: 2px solid transparent; }
        .nav-item:hover { transform: scale(1.1); }
        .nav-item.answered { background-color: #9e9e9e; color: #fff; }
        .nav-item.current { border: 3px solid #ffeb3b; }
        .nav-item.correct { background-color: #fff !important; color: #303f9f !important; }
        .nav-item.wrong { background-color: #f44336 !important; color: #fff !important; }
        .nav-item.marked::after { content: "⚠️"; position: absolute; bottom: -6px; right: -6px; font-size: 12px; z-index: 5; }

        .quiz-card { background-color: #1e1e1e; border-radius: 12px; padding: 30px; min-height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; position: relative; display: none; }
        .quiz-card.active { display: block; }
        .question-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 25px; }
        .question { font-size: 1.3rem; font-weight: bold; color: #fff; line-height: 1.5; flex: 1; }
        .mark-btn { background: #333; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; cursor: pointer; opacity: 0.6; transition: 0.3s; white-space: nowrap; }
        .mark-btn.active { opacity: 1; border-color: #ffab40; color: #ffab40; }

        .options-group { display: flex; flex-direction: column; gap: 12px; }
        .option-label { display: flex; align-items: center; padding: 16px; background-color: #2c2c2c; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .option-label:hover { background-color: #383838; }
        .option-label input { margin-right: 15px; transform: scale(1.3); flex-shrink: 0; }
        .option-label span { flex: 1; }
        .option-label.selected { border-color: #bb86fc; background-color: #332940; }

        .nav-btns { display: flex; justify-content: center; gap: 20px; margin-top: 30px; width: 100%; }
        .btn { padding: 12px 25px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-prev { background-color: #555; color: #fff; }
        .btn-next { background-color: #6200ee; color: #fff; }
        .btn-submit { background-color: #03dac6; color: #000; }

        .result-box { margin-top: 20px; padding: 18px; border-radius: 8px; display: none; border-left: 5px solid; }
        .correct-box { background-color: #1b5e20; color: #fff; border-color: #4caf50; }
        .wrong-box { background-color: #b71c1c; color: #fff; border-color: #ff5252; }
        .reason-box { background-color: #252525; color: #ffeb3b; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 1rem; border: 1px dashed #555; line-height: 1.4; }

        #summary-panel { background-color: #1e1e1e; border: 3px solid #bb86fc; padding: 30px; border-radius: 15px; text-align: center; display: none; margin-top: 30px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin-bottom: 20px; color: #fff; white-space: nowrap;">國立臺北藝術大學師資培育中心甄選題庫系統（114-116）</h2>
    <div id="nav-bar" class="nav-bar"></div>
    <div id="quiz-container"></div>
    <div class="nav-btns">
        <button id="prev-btn" class="btn btn-prev" onclick="changePage(-1)">上一題</button>
        <button id="next-btn" class="btn btn-next" onclick="changePage(1)">下一題</button>
        <button id="submit-btn-manual" class="btn btn-submit" onclick="handleFormSubmit()">送出答案</button>
    </div>
    <div id="summary-panel">
        <h2 id="score-title"></h2>
        <p id="summary-msg"></p>
        <button class="btn btn-next" onclick="resetQuiz()">重新開始測驗</button>
    </div>
</div>

<script>
    const originalData = [
        {
            q: "1.為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？",
            o: [
                "①3月19日",
                "②4月20日",
                "③5月21日",
                "④6月22日"
            ],
            a: 1,
            r: "為紀念「葉永鋕事件」，教育部自 112 年起訂定每年 4 月 20 日為性別平等教育日。"
        },
        {
            q: "2.近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？",
            o: [
                "①建構韌性防災校園與防災科技資源應用計畫",
                "②2030 雙語國家政策計畫",
                "③推動中小學數位學習精進方案",
                "④建構合作共享的校園圖書館系統中長程計畫"
            ],
            a: 2,
            r: "此為「生生用平板」政策，正式名稱為「推動中小學數位學習精進方案」。"
        },
        {
            q: "3.十二年國教新課綱提到的「跨領域統整課程」是指什麼？",
            o: [
                "①由不同學科的老師共同教授同一門部定必修課程",
                "②打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習",
                "③學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的課程，以增廣視野",
                "④除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。"
            ],
            a: 1,
            r: "跨領域統整課程強調打破單一特定學門界限，提供多元連結與互動學習。"
        },
        // … 後面題目已包含，為節省篇幅這裡省略，你直接貼上前面你提供的完整 originalData 即可
    ];

    let currentQuizData = [];
    let currentIndex = 0;
    let answers = {};
    let marks = {};
    let isSubmitted = false;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderNav() {
        const nav = document.getElementById('nav-bar');
        nav.innerHTML = '';
        currentQuizData.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.id = `nav-${i}`;
            div.innerText = i + 1;
            div.onclick = () => goToPage(i);
            if (isSubmitted) {
                const isCorrect = parseInt(answers[i]) === currentQuizData[i].a;
                div.classList.add(isCorrect ? 'correct' : 'wrong');
            } else if (answers[i] !== undefined) {
                div.classList.add('answered');
            }
            if (marks[i]) div.classList.add('marked');
            if (i === currentIndex) div.classList.add('current');
            nav.appendChild(div);
        });
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentQuizData.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = `quiz-card ${i === currentIndex ? 'active' : ''}`;
            card.id = `card-${i}`;
            let optionsHtml = '';
            item.o.forEach((opt, oi) => {
                const isSelected = answers[i] == oi;
                optionsHtml += `
                    <label class="option-label ${isSelected ? 'selected' : ''}">
                        <input type="radio" name="q${i}" value="${oi}" ${isSelected ? 'checked' : ''} onchange="selectOpt(${i}, ${oi})" ${isSubmitted ? 'disabled' : ''}>
                        <span>${opt}</span>
                    </label>
                `;
            });
            let feedbackHtml = '';
            if (isSubmitted) {
                const isCorrect = parseInt(answers[i]) === item.a;
                feedbackHtml = `
                    <div class="result-box ${isCorrect ? 'correct-box' : 'wrong-box'}" style="display:block">
                        ${isCorrect ? '✅ 答對了！' : '❌ 答錯了！'} <br>
                        <strong>正確答案：${item.o[item.a]}</strong>
                    </div>
                    <div class="reason-box"><strong>💡 解析：</strong><br>${item.r}</div>
                `;
            }
            card.innerHTML = `
                <div class="question-header">
                    <div class="question">${i + 1}. ${item.q}</div>
                    <button class="mark-btn ${marks[i] ? 'active' : ''}" onclick="toggleMark(${i})">標記此題 ⚠️</button>
                </div>
                <div class="options-group">${optionsHtml}</div>
                ${feedbackHtml}
            `;
            container.appendChild(card);
        });
        updateButtonVisibility();
    }

    window.selectOpt = function(qi, oi) {
        answers[qi] = oi;
        renderNav(); renderQuiz(); saveToLocal();
    };

    window.toggleMark = function(i) {
        marks[i] = !marks[i];
        renderNav(); renderQuiz(); saveToLocal();
    };

    window.changePage = function(step) {
        const nextIdx = currentIndex + step;
        if (nextIdx >= 0 && nextIdx < currentQuizData.length) { goToPage(nextIdx); }
    };

    function goToPage(idx) {
        currentIndex = idx;
        renderQuiz(); renderNav();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateButtonVisibility() {
        document.getElementById('prev-btn').style.visibility = (currentIndex === 0) ? 'hidden' : 'visible';
        document.getElementById('next-btn').style.visibility = (currentIndex === currentQuizData.length - 1) ? 'hidden' : 'visible';
        document.getElementById('submit-btn-manual').style.display = isSubmitted ? 'none' : 'block';
    }

    function saveToLocal() {
        localStorage.setItem('ntua_final_quiz_v4', JSON.stringify({ data: currentQuizData, answers, marks, isSubmitted }));
    }

    window.handleFormSubmit = function() {
        if (!confirm('確定送出並查看解析？')) return;
        executeSubmit();
    };

    function executeSubmit() {
        isSubmitted = true;
        let score = 0;
        currentQuizData.forEach((item, i) => { if (parseInt(answers[i]) === item.a) score++; });
        renderNav(); renderQuiz(); updateButtonVisibility();
        const panel = document.getElementById('summary-panel');
        panel.style.display = 'block';
        document.getElementById('score-title').innerText = `測驗完成！分數：${score} / ${currentQuizData.length}`;
        document.getElementById('summary-msg').innerText = `謝佳杰，所有題目都補齊了，祝你順利考取師培！加油！`;
        panel.scrollIntoView({ behavior: 'smooth' });
        saveToLocal();
    }

    window.resetQuiz = function() {
        localStorage.removeItem('ntua_final_quiz_v4');
        location.reload();
    };

    function init() {
        const saved = localStorage.getItem('ntua_final_quiz_v4');
        if (saved && confirm('要繼續上次未完成的測驗嗎？')) {
            const progress = JSON.parse(saved);
            currentQuizData = progress.data; answers = progress.answers; marks = progress.marks; isSubmitted = progress.isSubmitted || false;
            if (isSubmitted) document.getElementById('summary-panel').style.display = 'block';
        } else {
            currentQuizData = shuffle([...originalData]);
        }
        renderNav(); renderQuiz();
    }
    init();
</script>

</body>
</html>
