<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺北藝術大學師資培育中心甄選題庫系統</title>
    <style>
        * { font-family: "標楷體", "DFKai-SB", "BiauKai", serif; box-sizing: border-box; }
        body { background-color: #121212; color: #e0e0e0; line-height: 1.6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 850px; }
        .nav-bar { background-color: #303f9f; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nav-item { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; cursor: pointer; position: relative; background-color: #fff; color: #303f9f; transition: 0.2s; border: 2px solid transparent; }
        .nav-item:hover { transform: scale(1.1); }
        .nav-item.answered { background-color: #9e9e9e; color: #fff; }
        .nav-item.current { border: 3px solid #ffeb3b; }
        .nav-item.correct { background-color: #fff !important; color: #303f9f !important; }
        .nav-item.wrong { background-color: #f44336 !important; color: #fff !important; }
        .nav-item.marked::after { content: "⚠️"; position: absolute; bottom: -6px; right: -6px; font-size: 10px; z-index: 5; }

        .quiz-card { background-color: #1e1e1e; border-radius: 12px; padding: 30px; min-height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; position: relative; display: none; }
        .quiz-card.active { display: block; }
        .question-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 25px; }
        .question { font-size: 1.2rem; font-weight: bold; color: #fff; line-height: 1.5; flex: 1; }
        .mark-btn { background: #333; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .mark-btn.active { opacity: 1; border-color: #ffab40; color: #ffab40; }

        .options-group { display: flex; flex-direction: column; gap: 12px; }
        .option-label { display: flex; align-items: center; padding: 14px; background-color: #2c2c2c; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.05rem; }
        .option-label:hover { background-color: #383838; }
        .option-label input { margin-right: 15px; transform: scale(1.3); flex-shrink: 0; }
        .option-label span { flex: 1; }
        .option-label.selected { border-color: #bb86fc; background-color: #332940; }

        .nav-btns { display: flex; justify-content: center; gap: 15px; margin-top: 30px; width: 100%; }
        .btn { padding: 10px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-prev { background-color: #555; color: #fff; }
        .btn-next { background-color: #6200ee; color: #fff; }
        .btn-submit { background-color: #03dac6; color: #000; }

        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; border-left: 5px solid; }
        .correct-box { background-color: #1b5e20; color: #fff; border-color: #4caf50; }
        .wrong-box { background-color: #b71c1c; color: #fff; border-color: #ff5252; }
        .reason-box { background-color: #252525; color: #ffeb3b; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 0.95rem; border: 1px dashed #555; line-height: 1.4; }

        #summary-panel { background-color: #1e1e1e; border: 3px solid #bb86fc; padding: 30px; border-radius: 15px; text-align: center; display: none; margin-top: 30px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color: #fff;">國立臺北藝術大學師培甄選題庫 (完整 40 題版)</h2>
    <div id="nav-bar" class="nav-bar"></div>
    <div id="quiz-container"></div>
    <div class="nav-btns">
        <button id="prev-btn" class="btn btn-prev" onclick="changePage(-1)">上一題</button>
        <button id="next-btn" class="btn btn-next" onclick="changePage(1)">下一題</button>
        <button id="submit-btn-manual" class="btn btn-submit" onclick="handleFormSubmit()">送出答案</button>
    </div>
    <div id="summary-panel">
        <h2 id="score-title"></h2>
        <button class="btn btn-next" onclick="resetQuiz()">重新開始</button>
    </div>
</div>

<script>
    const data = [
        { q: "為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？", o: ["3 月 19 日", "4 月 20 日", "5 月 21 日", "6 月 22 日"], a: 1, r: "為紀念「葉永鋕事件」，教育部自 112 年起訂定每年 4 月 20 日為性別平等教育日。" },
        { q: "近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？", o: ["建構韌性防災校園與防災科技資源應用計畫", "2030 雙語國家政策計畫", "推動中小學數位學習精進方案", "建構合作共享的校園圖書館系統中長程計畫"], a: 2, r: "此為「生生用平板」政策，正式名稱為「推動中小學數位學習精進方案」。" },
        { q: "十二年國教新課綱提到的「跨領域統整課程」是指什麼？", o: ["由不同學科的老師共同教授同一門部定必修課程", "打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習", "學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的課程，以增廣視野", "除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。"], a: 1, r: "強調打破單一學門界限，提供多元連結學習。" },
        { q: "為了推動台灣成為雙語國家，教育部規劃多項措施以平衡偏鄉雙語教育資源不足的問題。請問下列的措施何者為非？", o: ["開出誘因引進雙語師資陣容", "與民間機構合作伴讀計畫", "讓孩子順其自然學習", "運用數位學習平台。"], a: 2, r: "推動雙語教育需主動介入，非順其自然。" },
        { q: "近幾年由於青少年偏差行為、憂鬱傾向、自我傷害事件案例日益增多，教育部正努力推動何種教育措施？", o: ["生命教育", "民主教育", "道德教育", "人權教育。"], a: 0, r: "生命教育旨在引導學生珍惜生命。" },
        { q: "依據最新修訂《校園霸凌防制準則》，下列說明何者有誤？", o: [
            "「霸凌」指個人或集體持續以言語、文字、圖畫、符號、肢體動作、電子通訊、網際網路或其他方式， 直接或間接對他人故意為貶抑、排擠、欺負、騷擾或戲弄等行為，使他人處於具有敵意或不友善環境， 產生精神上、生理上或財產上之損害，或影響正常學習活動之進行。",
            "教職員工知有疑似校園霸凌事件時，均應立即按學校校園霸凌防制規定所定權責向權責人員通報，並由學校權責人員向學校主管機關通報，至遲不得超過二十四小時。",
            "「校園霸凌」定義僅限於相同學校之學生對學生行為，且必須發生在校園內。",
            "疑似校園霸凌事件之被霸凌人或其法定代理人，得向行為人於行為發生時所屬之學校申請調查。"
        ], a: 2, r: "錯誤在於定義包含相同或不同學校，且不限於校園內發生。" },
        { q: "在班級經營時，教師不宜運用下列哪一種肢體語言？", o: ["運用身體姿勢以傳達教師的情緒", "運用眼神接觸，提醒聊天的同學停止說話", "走近不專心的同學，讓其注意力集中於課業", "經常碰觸學生身體以表示親切。"], a: 3, r: "應避免不必要肢體碰觸。" },
        { q: "下列何者不屬於最新修訂之實驗教育三法？", o: ["《學校型態實驗教育實施條例》", "《高級中等以下教育階段非學校型態實驗教育實施條例》", "《公立高級中等以下學校委託私人辦理實驗教育條例》", "《高級中等學校教育實驗辦法》"], a: 3, r: "實驗三法為學校型態、非學校型態、公立委託私人。" },
        { q: "依據「兒童及少年福利法」第34條規定，教師知悉有遭受身心虐待之情事者，應立即向直轄市、縣(市)主管機關通報，至遲不得超過多久?", o: ["24小時", "36小時", "48小時", "72小時。"], a: 0, r: "法規規定為 24 小時。" },
        { q: "依據師資培育法之規定，為培育教師任教學科、領域、群科專長之專門知能課程，屬於下列何者的定義？", o: ["專門課程", "教育專業課程", "普通課程", "師資職前教育課程。"], a: 0, r: "專門課程即學科專業能力。" },
        { q: "孩子王阿布要求班上的同學都不可以與他討厭的同學阿達互動，要讓他交不到朋友。阿布的做法，是屬於霸凌分類中的何種霸凌？", o: ["網路霸凌", "肢體霸凌", "言語霸凌", "關係霸凌"], a: 3, r: "孤立、排擠屬於關係霸凌。" },
        { q: "翻轉教室（Flipped Classroom）模式最主要的理念為何？", o: ["翻轉學生間的程度落差，優先照顧程度差的學生", "翻轉學科間的知識藩籬，採用跨科統整教學模式", "翻轉學校間的資源落差，提供偏鄉學校更多資源", "翻轉學習順序，讓學生先在家看資料影片，再來課堂上討論提問。"], a: 3, r: "課前看影片，課堂討論。" },
        { q: "終身學習的教師圖像分為三大向度，下列何者不是向度的名稱？", o: ["教育愛", "專業力", "未來力", "創新力。"], a: 3, r: "三大向度：教育愛、專業力、未來力。" },
        { q: "自107年開始，有關教育實習的相關規定，以下何者正確？", o: ["師資生必須通過教師資格檢定考後使得參與教育實習", "修畢師資職前教育課程，且通過本校教育專業成長時數審查者得以申請實習", "教育實習成績之評量統一由實習機構評定", "以上皆非。"], a: 0, r: "改為「先檢定後實習」。" },
        { q: "下列何者不是師資培育中心的學生取得教師證書之途徑？", o: ["修畢師資職前教育課程", "通過教師甄試", "通過教師資格檢定考試", "修畢教育實習課程。"], a: 1, r: "教師甄試是錄取職缺，非取得證書。" },
        { q: "零體罰明訂在下列哪項法規中？", o: ["教師法", "兒童及少年福利與權益保障法", "師資培育法", "教育基本法。"], a: 3, r: "《教育基本法》第 8 條。" },
        { q: "實施補救教學的主要目的為何？", o: ["強化多元文化教育", "促進教育機會均等", "提供更多就業機會", "提升菁英教育水準。"], a: 1, r: "落實教育公平。" },
        { q: "實習學生在教育實習期間，擔任教學活動之每週累計總節（時）數上限為？", o: ["6", "8", "10", "12"], a: 2, r: "上限為 10 節。" },
        { q: "有關我國目前十二年國民基本教育的敘述，下列何者正確？", o: ["高級中等教育全面免學費。", "分兩階段，國中小階段依據「教育基本法」，高中職階段依據「高級中等教育法」規定辦理。", "重視以學生為中心的教學，全面免試。", "提供強迫入學的國民教育機會。"], a: 1, r: "兩階段各依其法規辦理。" },
        { q: "教師對學生期望會影響學習效果。下列敘述何者正確？", o: ["教師對學生期望要保持低度標準。", "教師一定要瞭解學生，小心運用自我應驗的預言。", "當學生參與程度較少，可導致期望較高。", "比馬龍效應必使學生自我概念良好。"], a: 1, r: "應正向運用期望效果。" },
        { q: "未來學校教師針對教學問題進行研究，下列何種方法較適合？", o: ["實驗研究法", "訪談法", "行動研究法", "問卷調查法。"], a: 2, r: "行動研究最貼合現場。" },
        { q: "依據「性別平等教育法」，有關國中實施課程，下列何者錯誤？", o: ["教材應呈現多元觀點", "應利用空白課程進行性平教育相關課程或活動", "不得因性別而有差別待遇", "每學期至少實施四小時課程。"], a: 1, r: "應融入正式課程。" },
        { q: "課程重視新移民原生文化，落實何層面？", o: ["教育機會均等", "社會化", "社會階層化", "選擇與分配。"], a: 0, r: "均等與尊重多元。" },
        { q: "下列何者不屬於教師義務？", o: ["擔任導師", "參加教師組織", "積極維護學生權益", "研究進修。"], a: 1, r: "參加組織是權利。" },
        { q: "行政院「2030 雙語國家」政策藍圖中，不包括何者？", o: ["延伸至幼兒園", "各學科均英語授課", "英語科全英語授課", "推動雙聯學位。"], a: 1, r: "目前非全面學科英語授課。" },
        { q: "品格教育、校園安全等議題反映家長重視？", o: ["親子關係", "培養孩子正確的價值觀", "孩子快樂", "成績課業。"], a: 1, r: "首重價值觀。" },
        { q: "關於學校本位課程的陳述，何者為非?", o: ["自主課程改革", "由中央負責統籌指導", "辦學特色", "結合社區。"], a: 1, r: "由學校自主。" },
        { q: "陳老師樂於學習新方法應用，符合哪個向度？", o: ["教育愛", "專業力", "未來力", "創新力。"], a: 2, r: "未來力。" },
        { q: "AI 在教育中的角色是什麼？", o: ["取代教師", "標準化材料", "限制創意", "輔導教育者，提供具彈性的學習環境"], a: 3, r: "輔助與優化工具。" },
        { q: "雙語教育在臺灣推動的重點，何者有誤？", o: [
            "全校教職員均有責任建置學校雙語環境，校長應率先使用雙語。",
            "英語教學是在為學生的英語能力打底，學生具備基礎英語能力後，有可能接受雙語教育。",
            "授課教師採用課室英語，學科內容可以國語授課。",
            "目前臺灣雙語教育推動最理想狀況是增能英語教師的學科知識，使其 能在課堂中使用兩種語言來教學。"
        ], a: 3, r: "應是增能「學科教師」的英語力。" },
        { q: "台灣雙語教育期待英文教師扮演的角色，何者有誤？", o: [
            "專業發展者：扮演提昇校長、行政與學科教師基本英語能力的專業發展者。",
            "同步翻譯者：為避免學生拒絕雙語教育，教師若以英語講述一段內容後，應將英文翻成國語再講一次。",
            "經驗分享者：提供學科教師在雙語教學之相關經驗。",
            "專業陪伴者：與學科教師共備，提供雙語教學教案與教學策略之專業諮詢。"
        ], a: 1, r: "英文教師不扮演同步翻譯角色。" },
        { q: "關於輔導工作原則，何者最不適切？", o: ["導師需負責", "不能獨立於教學外", "科任也需負責", "主要工作為學習輔導。"], a: 3, r: "輔導涵蓋廣泛，非僅限學習。" },
        { q: "有關課程、教材與教科書描述，何者有誤?", o: ["教材是課程一部分", "教科書和教材互不包含", "簡報屬教材", "反映目標。"], a: 1, r: "教科書屬教材。" },
        { q: "高級中等學校學生不明原因未到校連續達三日者稱為：", o: ["中輟生", "中離生", "長缺生", "不明原因學生"], a: 1, r: "高中為中離生。" },
        { q: "因法規事由暫時停止聘約關係者稱為：", o: ["停聘", "解聘", "不續聘", "懸缺待聘"], a: 0, r: "暫時停止為停聘。" },
        { q: "教師在聘約存續期間，依規定終止聘約關係且不再聘任者：", o: ["停聘", "解聘", "資遣", "停職"], a: 1, r: "終止關係為解聘。" },
        { q: "雙語教育推動趨勢中，有關台灣目前重點何者正確？", o: ["雙語教育採國語英語兩種語言進行教學", "完全等同純英語教學", "多採用全沉浸模式", "目的是取代母語"], a: 0, r: "兩種語言協同教學。" },
        { q: "想透過實驗知道創新教學是否有效，使用的是：", o: ["實驗法", "相關法", "訪談法", "觀察法"], a: 0, r: "驗證成效屬實驗法。" },
        { q: "六三三學制仿效自：", o: ["日本", "美國", "英國", "德國"], a: 1, r: "仿效美國學制。" },
        { q: "偏鄉資源不均涉及到哪個教育議題？", o: ["專業能力", "機會均等", "選擇權", "終身學習"], a: 1, r: "機會均等議題。" }
    ];

    let currentIdx = 0; let answers = {}; let marks = {}; let isSubmitted = false;

    function renderNav() {
        const nav = document.getElementById('nav-bar'); nav.innerHTML = '';
        data.forEach((_, i) => {
            const div = document.createElement('div'); div.className = 'nav-item';
            div.innerText = i + 1; div.onclick = () => goToPage(i);
            if (isSubmitted) div.classList.add(parseInt(answers[i]) === data[i].a ? 'correct' : 'wrong');
            else if (answers[i] !== undefined) div.classList.add('answered');
            if (marks[i]) div.classList.add('marked');
            if (i === currentIdx) div.classList.add('current');
            nav.appendChild(div);
        });
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container'); container.innerHTML = '';
        const item = data[currentIdx];
        const card = document.createElement('div'); card.className = 'quiz-card active';
        let optionsHtml = '';
        item.o.forEach((opt, oi) => {
            const isSelected = answers[currentIdx] == oi;
            optionsHtml += `
                <label class="option-label ${isSelected ? 'selected' : ''}">
                    <input type="radio" name="q" value="${oi}" ${isSelected ? 'checked' : ''} onchange="selectOpt(${oi})" ${isSubmitted ? 'disabled' : ''}>
                    <span>${opt}</span>
                </label>
            `;
        });
        let feedbackHtml = '';
        if (isSubmitted) {
            const isCorrect = parseInt(answers[currentIdx]) === item.a;
            feedbackHtml = `
                <div class="result-box ${isCorrect ? 'correct-box' : 'wrong-box'}" style="display:block">
                    ${isCorrect ? '✅ 答對！' : '❌ 答錯！'} 正確答案：${item.o[item.a]}
                </div>
                <div class="reason-box"><strong>💡 完整解析：</strong><br>${item.r}</div>
            `;
        }
        card.innerHTML = `
            <div class="question-header">
                <div class="question">${currentIdx + 1}. ${item.q}</div>
                <button class="mark-btn ${marks[currentIdx] ? 'active' : ''}" onclick="toggleMark()">標記此題 ⚠️</button>
            </div>
            <div class="options-group">${optionsHtml}</div>
            ${feedbackHtml}
        `;
        container.appendChild(card); updateBtns();
    }

    window.selectOpt = (oi) => { answers[currentIdx] = oi; renderNav(); renderQuiz(); };
    window.toggleMark = () => { marks[currentIdx] = !marks[currentIdx]; renderNav(); renderQuiz(); };
    window.changePage = (step) => { const next = currentIdx + step; if (next >= 0 && next < data.length) goToPage(next); };
    function goToPage(idx) { currentIdx = idx; renderQuiz(); renderNav(); window.scrollTo(0, 0); }
    function updateBtns() {
        document.getElementById('prev-btn').style.visibility = (currentIdx === 0) ? 'hidden' : 'visible';
        document.getElementById('next-btn').style.visibility = (currentIdx === data.length - 1) ? 'hidden' : 'visible';
        document.getElementById('submit-btn-manual').style.display = isSubmitted ? 'none' : 'block';
    }
    window.handleFormSubmit = () => { if (confirm('送出答案？')) { isSubmitted = true; renderNav(); renderQuiz(); document.getElementById('summary-panel').style.display = 'block'; document.getElementById('score-title').innerText = `已送出，請點選上方題號查看完整文字解析！`; } };
    window.resetQuiz = () => location.reload();

    renderNav(); renderQuiz();
</script>
</body>
</html>
