<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺北藝術大學師資培育中心甄選題庫系統</title>
    <style>
        * { font-family: "標楷體", "DFKai-SB", "BiauKai", serif; box-sizing: border-box; }
        body { background-color: #121212; color: #e0e0e0; line-height: 1.6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 850px; }

        .nav-bar { 
            background-color: #303f9f; 
            padding: 15px; 
            border-radius: 8px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            justify-content: center; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-item {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            position: relative; background-color: #fff; color: #303f9f;
            transition: 0.2s; border: 2px solid transparent;
        }

        .nav-item:hover { transform: scale(1.1); }
        .nav-item.answered { background-color: #9e9e9e; color: #fff; }
        .nav-item.current { border: 3px solid #ffeb3b; }
        .nav-item.correct { background-color: #fff !important; color: #303f9f !important; }
        .nav-item.wrong { background-color: #f44336 !important; color: #fff !important; }

        .nav-item.marked::after {
            content: "⚠️"; position: absolute; bottom: -6px; right: -6px; font-size: 14px; z-index: 2;
        }

        .quiz-card { 
            background-color: #1e1e1e; border-radius: 12px; padding: 30px; 
            min-height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333; position: relative; display: none;
        }
        .quiz-card.active { display: block; }

        .question { font-size: 1.3rem; font-weight: bold; margin-bottom: 25px; color: #fff; line-height: 1.5; }
        .options-group { display: flex; flex-direction: column; gap: 12px; }

        .option-label { 
            display: flex; align-items: center; padding: 16px; 
            background-color: #2c2c2c; border: 2px solid transparent; 
            border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; 
        }
        .option-label:hover { background-color: #383838; }
        .option-label input { margin-right: 15px; transform: scale(1.3); }
        .option-label.selected { border-color: #bb86fc; background-color: #332940; }

        .mark-btn {
            position: absolute; top: 15px; right: 15px;
            background: transparent; border: none; font-size: 1.5rem;
            cursor: pointer; opacity: 0.5; transition: 0.3s;
        }
        .mark-btn.active { opacity: 1; filter: drop-shadow(0 0 5px #ffab40); }

        .nav-btns { display: flex; justify-content: center; gap: 20px; margin-top: 30px; width: 100%; }
        .btn { padding: 12px 25px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-prev { background-color: #555; color: #fff; }
        .btn-next { background-color: #6200ee; color: #fff; }
        .btn-submit { background-color: #03dac6; color: #000; }

        #summary-panel {
            background-color: #1e1e1e; border: 3px solid #bb86fc;
            padding: 30px; border-radius: 15px; text-align: center;
            display: none; margin-top: 30px; width: 100%;
        }

        .result-box { margin-top: 20px; padding: 18px; border-radius: 8px; display: none; border-left: 5px solid; }
        .correct-box { background-color: #1b5e20; color: #fff; border-color: #4caf50; }
        .wrong-box { background-color: #b71c1c; color: #fff; border-color: #ff5252; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin-bottom: 20px; color: #fff;">國立臺北藝術大學師資培育中心甄選題庫（114-116）</h2>
    
    <div id="nav-bar" class="nav-bar"></div>

    <div id="quiz-container"></div>

    <div class="nav-btns">
        <button id="prev-btn" class="btn btn-prev" onclick="changePage(-1)">上一題</button>
        <button id="next-btn" class="btn btn-next" onclick="changePage(1)">下一題</button>
        <button id="submit-btn-manual" class="btn btn-submit" onclick="handleFormSubmit()">送出答案</button>
    </div>

    <div id="summary-panel">
        <h2 id="score-title"></h2>
        <p id="summary-msg"></p>
        <button class="btn btn-next" onclick="resetQuiz()">重新開始測驗</button>
    </div>
</div>

<script>
    const originalData = [
        { q: "1.為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？", o: ["3 月 19 日", "4 月 20 日", "5 月 21 日", "6 月 22 日"], a: 1 },
        { q: "2.近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？", o: ["建構韌性防災校園與防災科技資源應用計畫", "2030 雙語國家政策計畫", "推動中小學數位學習精進方案", "建構合作共享的校園圖書館系統中長程計畫"], a: 2 },
        { q: "3. 十二年國教新課綱提到的「跨領域統整課程」是指什麼？", o: ["由不同學科的老師共同教授同一門部定必修課程", "打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習", "學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的 課程，以增廣視野", "除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。"], a: 1 },
        { q: "4. 為了推動台灣成為雙語國家，教育部規劃多項措施以平衡偏鄉雙語教育資源不足 的問題。請問下列的措施何者為非？", o: ["開出誘因引進雙語師資陣容", "與民間機構合作伴讀計畫", "讓孩子順其自然學習", "運用數位學習平台。"], a: 2 },
        { q: "5. 近幾年由於青少年偏差行為、憂鬱傾向、自我傷害事件案例日益增多，教育部正努力推動何種教育措施？", o: ["生命教育", "民主教育", "道德教育", "人權教育。"], a: 0 },
        { q: "6. 在班級經營時，教師不宜運用下列哪一種肢體語言？", o: ["運用身體姿勢以傳達教師的情緒", "運用眼神接觸，提醒聊天的同學停止說話", "走近不專心的同學，讓其注意力集中於課業", "經常碰觸學生身體以表示親切。"], a: 3 },
        { q: "7. 下列何者不屬於最新修訂之實驗教育三法？", o: ["《學校型態實驗教育實施條例》", "《高級中等以下教育階段非學校型態實驗教育實施條例》", "《公立高級中等以下學校委託私人辦理實驗教育條例》", "《高級中等學校教育實驗辦法》"], a: 3 },
        { q: "8. 依據「兒童及少年福利法」第34條規定，教師知悉有遭受身心虐待之情事者，應立即向直轄市、縣(市)主管機關通報，至遲不得超過多久?", o: ["24小時", "36小時", "48小時", "72小時。"], a: 0 },
        { q: "9. 依據師資培育法之規定，為培育教師任教學科、領域、群科專長之專門知能課程，屬於下列何者的定義？", o: ["專門課程", "教育專業課程", "普通課程", "師資職前教育課程。"], a: 0 },
        { q: "10. 孩子王阿布要求班上的同學都不可以與他討厭的同學阿達互動，要讓他交不到朋友。阿布的做法，是屬於霸凌分類中的何種霸凌？", o: ["網路霸凌", "肢體霸凌", "言語霸凌", "關係霸凌"], a: 3 },
        { q: "11. 近來教育現場倡導翻轉教室（Flipped Classroom）模式方興未艾，請問翻轉教室最主要的理念為何？", o: ["翻轉學生間的程度落差，優先照顧程度差的學生", "翻轉學科間的知識藩籬，採用跨科統整教學模式", "翻轉學校間的資源落差，提供偏鄉學校更多資源", "翻轉學習順序，讓學生先在家看資料影片，再來課堂上討論提問。"], a: 3 },
        { q: "12. 教育部為導引我國師資培育與教師專業發展，並配合新課綱的內涵，建構新的教師圖像作為教師專業發展的藍圖，此教師圖像稱為終身學習的教師圖像。終身學習的教師圖像分為三大向度，下列何者不是向度的名稱？", o: ["教育愛", "專業力", "未來力", "創新力。"], a: 3 },
        { q: "13. 自107年開始，有關教育實習的相關規定，以下何者正確？", o: ["師資生必須通過教師資格檢定考後使得參與教育實習", "修畢師資職前教育課程，且通過本校教育專業成長時數審查者得以申請實習", "教育實習成績之評量統一由實習機構評定", "以上皆非。"], a: 0 },
        { q: "14.下列何者不是師資培育中心的學生取得教師證書之途徑？", o: ["修畢師資職前教育課程", "通過教師甄試", "通過教師資格檢定考試", "修畢教育實習課程。"], a: 1 },
        { q: "15. 我國於 2006 年成為全球第 109 個正式廢除體罰的國家，以保障學生身體自主權，請 問零體罰明訂在下列哪項法規中？", o: ["教師法", "兒童及少年福利與權益保障法", "師資培育法", "教育基本法。"], a: 3 },
        { q: "16. 對於學習成就落後的學生實施補救教學，是十二年國教重要政策方案之一，其主要目的為何？", o: ["強化多元文化教育", "促進教育機會均等", "提供更多就業機會", "提升菁英教育水準。"], a: 1 },
        { q: "17. 根據最新修訂「師資培育之大學及教育實習機構辦理教育實習辦法」，實習學生經師資培育之大學同意，可以在教育實習期間，於機構內擔任補救教學、社團活動指導、監考或其他教學活動，每週累計總節（時）數上限為？", o: ["6", "8", "10", "12"], a: 2 },
        { q: "18. 有關我國目前十二年國民基本教育的敘述，下列何者正確？", o: ["高級中等教育全面免學費。", "分兩階段，國中小階段依據「教育基本法」，高中職階段依據「高級中等教育法」規定辦理。", "重視以學生為中心的教學，全面免試，依據國中畢業生之性向、能力和興趣，提供升學的分流選擇。", "採均一原則，依據「強迫入學條例」，提供普及、強迫入學的國民教育機會。"], a: 1 },
        { q: "19. 教師期望會影響學生的學習效果。下列的相關敘述何者正確？", o: ["教師對學生期望要保持低度標準，減緩學習壓力。", "教師一定要瞭解學生，小心運用自我應驗的預言。", "當學生參與程度較少，可導致學生自我期望較高。", "比馬龍效應，一定會使學生變成自我概念良好的人。"], a: 1 },
        { q: "20. 未來學校教師除了教學外，尚需針對教學問題進行研究，下列何種研究方法較適合教師使用？", o: ["實驗研究法", "訪談法", "行動研究法", "問卷調查法。"], a: 2 },
        { q: "21. 家長們關心的「性平」議題，請問依據「性別平等教育法」規定，有關國民中學實施性別平等教育課程、教材與教學，下列敘述何者錯誤？", o: ["教材內容應呈現多元之性別觀點", "應利用空白課程進行性別平等教育相關課程或活動", "學校之課程設置及活動設計不得因性別而有差別待遇", "每學期至少實施四小時性別平等教育相關課程或活動。"], a: 1 },
        { q: "22. 學校課程中如重視新移民的原生文化，以展現多元文化的精神，主要在落實何種層面的教育政策？", o: ["教育機會均等", "社會化", "社會階層化", "選擇與分配。"], a: 0 },
        { q: "23. 根據我國的《教師法》之規定，下列何者不是屬於教師的義務？", o: ["擔任導師", "參加教師組織", "積極維護學生受教之權益", "從事與教學有關之研究、進修。"], a: 1 },
        { q: "24. .行政院提出「2030 雙語國家」政策藍圖，下列何者不包括在此藍圖中？", o: ["延伸雙語教學至幼兒園", "推動中小學各學科英語授課", "落實中小學英語科全英語授課", "推動雙聯學位等措施，促進教育體系國際化。"], a: 1 },
        { q: "25. 全國家長最關心的十大教育議題出爐，前十名分別為品格教育是第一名、校園安全 和性平、校園霸凌並列第二名，「心理健康」則是第三名。至於考招、課綱議題， 則落到第十名。可見家長現在最重視的議題是？", o: ["親子關係", "培養孩子正確的價值觀", "孩子快樂不快樂", "孩子在學校的成績課業。"], a: 1 },
        { q: "26.下列關於學校本位課程的陳述，何者為非?", o: ["學校自主的課程改革", "由中央負責統籌指導", "能發揮學校辦學特色", "結合社區特色發展。"], a: 1 },
        { q: "27. 陳老師很樂於學習新的教學方法與評量方法，且將所學到的新式教學方式與評量方法，應用於他自己的課堂教學活動中。請問陳老師的這種作為，符合教育部公布的教育圖像中的哪個向度內涵？", o: ["教育愛", "專業力", "未來力", "批判力。"], a: 2 },
        { q: "28. 請問近年十分熱門的AI人工智慧科技在教育中的角色是什麼？", o: ["取代教師的角色", "提供更多標準化的學習材料", "限制學生的創意和思維能力", "輔助教育者，提供更具彈性的學習環境"], a: 3 },
        { q: "29. 台灣雙語教育期待英文教師扮演的角色，何者有誤？", o: ["專業發展者：扮演提昇校長、行政與學科教師基本英語能力的專業發展者。", "同步翻譯者：為避免學生拒絕雙語教育，教師若以英語講述一段內容後， 應將英文翻成國語再講一次。", "經驗分享者：提供學科教師在雙語教學之相關經驗。", "專業陪伴者：與學科教師共備，提供雙語教學教案與教學策略之專業諮詢。"], a: 1 },
        { q: "30. 學校輔導一種專業的助人過程，輔導目標不僅在協助當事人解決問題，也培養當事人獨立面對問題解決的能力，發揮自我潛能。輔導工作有其原則，下列那個原則最不適切？", o: ["每位導師都需要負責輔導工作", "輔導不能獨立於教學活動之外", "科任教師也需要負責輔導工作", "輔導主要工作事項為學習輔導。"], a: 3 },
        { q: "31. 下列有關課程、教材與教科書的關係描述,何者有誤?", o: ["教材是課程的一部分。", "教科書和教材互不包含。", "教師製作影片、簡報屬於教材。", "教科書或教材能反映課程的目標。"], a: 1 },
        { q: "32. 依據最新修訂《校園霸凌防制準則》，下列說明何者有誤？", o: ["「霸凌」指個人或集體持續以言語、文字、圖畫、符號、肢體動作...等。", "教職員工知有疑似事件時，均應立即通報...至遲不得超過二十四小時。", "「校園霸凌」指相同或不同學校校長及教師、職員、工友、學生對學生...", "疑似校園霸凌事件之被霸凌人或其法定代理人，得向行為人所屬學校申請調查。"], a: 2 },
        { q: "33. 根據法規：高級中等學校學生未經請假或不明原因未到校上課連續達三日以上者稱為何種類型學生？", o: ["中途輟學學生(中輟生)", "中途離校學生(中離生)", "長期缺課學生(長缺生)", "不明原因學生(不明生)"], a: 1 },
        { q: "34. 一位教師想知道創新教學策略是否比傳統策略更為有效...這位教師使用的是那一種研究類型？", o: ["實驗法", "研究法", "相關法", "描述法。"], a: 0 },
        { q: "35. 「十二年國教」試圖將國小六年、國中與高中各三年進行規劃...請問此「六三三」學制是仿效下列哪個國家？", o: ["日本", "美國", "英國", "德國。"], a: 1 },
        { q: "36. 近年來，社會大眾相當關切偏鄉國中生的高中會考成績偏低情況，此問題主要涉及到下列哪個重要的教育議題？", o: ["終身學習能力", "教師專業能力", "教育機會均等", "家長教育選擇權。"], a: 2 },
        { q: "37. 雙語教育在臺灣的教育現場已成為趨勢，有關台灣雙語教育目前推動的重點，何者有誤？", o: ["全校教職員均有責任建置環境，校長應率先使用雙語。", "英語打底後，學生具備基礎能力後，有可能接受雙語教育。", "授課教師採用課室英語，學科內容可以國語授課。", "理想狀況是增能英語教師的學科知識，使其能在課堂中使用兩種語言教學。"], a: 3 },
        { q: "38. 根據107年最新修訂「教育實習辦法」，實習學生的教學實習節數，應為專任教師基本教學節數的", o: ["四分之一以上二分之一以下", "六分之一以上二分之一以下", "八分之一以上二分之一以下", "以上皆非。"], a: 1 },
        { q: "39. 雙語教育在臺灣的教育現場已成為趨勢，有關台灣雙語教育重點的敘述何者正確？", o: ["雙語教育是採用國語和英語兩種語言進行教學。", "雙語教育是英語教學。", "台灣雙語教育多數採用加拿大的沉浸式教學模式。", "雙語教育是全英語教學（EMI）。"], a: 0 },
        { q: "40. 依「教師法施行細則」之規定，教師在聘約存續期間...暫時停止聘約關係者，稱之為：", o: ["停聘", "解聘", "不續聘", "懸缺待聘。"], a: 0 }
    ];

    let currentQuizData = [];
    let currentIndex = 0;
    let answers = {};
    let marks = {};
    let isSubmitted = false;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderNav() {
        const nav = document.getElementById('nav-bar');
        nav.innerHTML = '';
        currentQuizData.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.id = `nav-${i}`;
            div.innerText = i + 1;
            div.onclick = () => goToPage(i);
            
            if (isSubmitted) {
                const isCorrect = parseInt(answers[i]) === currentQuizData[i].a;
                div.classList.add(isCorrect ? 'correct' : 'wrong');
            } else if (answers[i] !== undefined) {
                div.classList.add('answered');
            }
            if (marks[i]) div.classList.add('marked');
            if (i === currentIndex) div.classList.add('current');
            
            nav.appendChild(div);
        });
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentQuizData.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = `quiz-card ${i === currentIndex ? 'active' : ''}`;
            card.id = `card-${i}`;
            
            let optionsHtml = '';
            item.o.forEach((opt, oi) => {
                const isSelected = answers[i] == oi;
                optionsHtml += `
                    <label class="option-label ${isSelected ? 'selected' : ''}">
                        <input type="radio" name="q${i}" value="${oi}" ${isSelected ? 'checked' : ''} onchange="selectOpt(${i}, ${oi})" ${isSubmitted ? 'disabled' : ''}>
                        <span>${opt}</span>
                    </label>
                `;
            });

            card.innerHTML = `
                <button class="mark-btn ${marks[i] ? 'active' : ''}" onclick="toggleMark(${i})">⚠️</button>
                <div class="question">${item.q}</div>
                <div class="options-group">${optionsHtml}</div>
                <div id="res-${i}" class="result-box"></div>
            `;
            container.appendChild(card);
        });
        updateButtonVisibility();
    }

    window.selectOpt = function(qi, oi) {
        answers[qi] = oi;
        renderNav();
        renderQuiz();
        saveToLocal();
    };

    window.toggleMark = function(i) {
        marks[i] = !marks[i];
        renderNav();
        renderQuiz();
        saveToLocal();
    };

    window.changePage = function(step) {
        const nextIdx = currentIndex + step;
        if (nextIdx >= 0 && nextIdx < currentQuizData.length) {
            goToPage(nextIdx);
        }
    };

    function goToPage(idx) {
        currentIndex = idx;
        renderQuiz();
        renderNav();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateButtonVisibility() {
        document.getElementById('prev-btn').style.visibility = (currentIndex === 0 || isSubmitted) ? 'hidden' : 'visible';
        document.getElementById('next-btn').style.visibility = (currentIndex === currentQuizData.length - 1 || isSubmitted) ? 'hidden' : 'visible';
        document.getElementById('submit-btn-manual').style.display = isSubmitted ? 'none' : 'block';
    }

    function saveToLocal() {
        localStorage.setItem('ntua_quiz_final_safe', JSON.stringify({ data: currentQuizData, answers, marks }));
    }

    window.handleFormSubmit = function() {
        const answeredCount = Object.keys(answers).length;
        if (answeredCount < currentQuizData.length) {
            if (!confirm(`尚未完成作答（已答 ${answeredCount}/${currentQuizData.length}），是否直接送出？`)) return;
        } else {
            if (!confirm('確定送出試卷？')) return;
        }
        executeSubmit();
    };

    function executeSubmit() {
        isSubmitted = true;
        let score = 0;
        currentQuizData.forEach((item, i) => {
            const resBox = document.getElementById(`res-${i}`);
            resBox.style.display = 'block';
            if (parseInt(answers[i]) === item.a) {
                score++;
                resBox.className = 'result-box correct-box';
                resBox.innerHTML = `✅ 答對！`;
            } else {
                resBox.className = 'result-box wrong-box';
                resBox.innerHTML = `❌ 答錯！正確答案：${item.o[item.a]}`;
            }
        });
        
        renderNav();
        updateButtonVisibility();
        const panel = document.getElementById('summary-panel');
        panel.style.display = 'block';
        document.getElementById('score-title').innerText = `測驗結果：${score} / ${currentQuizData.length}`;
        document.getElementById('summary-msg').innerText = `謝佳杰，辛苦了！（較建議此版本）`;
        panel.scrollIntoView({ behavior: 'smooth' });
    }

    window.resetQuiz = function() {
        localStorage.removeItem('ntua_quiz_final_safe');
        location.reload();
    };

    function init() {
        const saved = localStorage.getItem('ntua_quiz_final_safe');
        if (saved && confirm('恢復進度？')) {
            const progress = JSON.parse(saved);
            currentQuizData = progress.data;
            answers = progress.answers;
            marks = progress.marks;
        } else {
            currentQuizData = shuffle([...originalData]);
        }
        renderNav();
        renderQuiz();
    }

    init();
</script>
</body>
</html>
