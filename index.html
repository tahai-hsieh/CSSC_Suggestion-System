<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺北藝術大學師資培育中心甄選題庫系統</title>
    <style>
        * { font-family: "標楷體", "DFKai-SB", "BiauKai", serif; box-sizing: border-box; }
        body { background-color: #121212; color: #e0e0e0; line-height: 1.6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 850px; }
        .nav-bar { background-color: #303f9f; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nav-item { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; cursor: pointer; position: relative; background-color: #fff; color: #303f9f; transition: 0.2s; border: 2px solid transparent; }
        .nav-item:hover { transform: scale(1.1); }
        .nav-item.answered { background-color: #9e9e9e; color: #fff; }
        .nav-item.current { border: 3px solid #ffeb3b; }
        .nav-item.correct { background-color: #fff !important; color: #303f9f !important; }
        .nav-item.wrong { background-color: #f44336 !important; color: #fff !important; }
        
        /* 標記符號持續釘在右下角 */
        .nav-item.marked::after { content: "⚠️"; position: absolute; bottom: -6px; right: -6px; font-size: 12px; z-index: 5; }

        .quiz-card { background-color: #1e1e1e; border-radius: 12px; padding: 30px; min-height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; position: relative; display: none; }
        .quiz-card.active { display: block; }
        .question-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 25px; }
        .question { font-size: 1.3rem; font-weight: bold; color: #fff; line-height: 1.5; flex: 1; }
        .mark-btn { background: #333; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; cursor: pointer; opacity: 0.6; transition: 0.3s; white-space: nowrap; }
        .mark-btn.active { opacity: 1; border-color: #ffab40; color: #ffab40; }

        .options-group { display: flex; flex-direction: column; gap: 12px; }
        .option-label { display: flex; align-items: center; padding: 16px; background-color: #2c2c2c; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .option-label:hover { background-color: #383838; }
        .option-label input { margin-right: 15px; transform: scale(1.3); flex-shrink: 0; }
        .option-label span { flex: 1; }
        .option-label.selected { border-color: #bb86fc; background-color: #332940; }

        .nav-btns { display: flex; justify-content: center; gap: 20px; margin-top: 30px; width: 100%; }
        .btn { padding: 12px 25px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-prev { background-color: #555; color: #fff; }
        .btn-next { background-color: #6200ee; color: #fff; }
        .btn-submit { background-color: #03dac6; color: #000; }

        .result-box { margin-top: 20px; padding: 18px; border-radius: 8px; display: none; border-left: 5px solid; }
        .correct-box { background-color: #1b5e20; color: #fff; border-color: #4caf50; }
        .wrong-box { background-color: #b71c1c; color: #fff; border-color: #ff5252; }
        .reason-box { background-color: #252525; color: #ffeb3b; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 1rem; border: 1px dashed #555; line-height: 1.4; }

        #summary-panel { background-color: #1e1e1e; border: 3px solid #bb86fc; padding: 30px; border-radius: 15px; text-align: center; display: none; margin-top: 30px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin-bottom: 20px; color: #fff;">國立臺北藝術大學師資培育中心甄選題庫系統</h2>
    <div id="nav-bar" class="nav-bar"></div>
    <div id="quiz-container"></div>
    <div class="nav-btns">
        <button id="prev-btn" class="btn btn-prev" onclick="changePage(-1)">上一題</button>
        <button id="next-btn" class="btn btn-next" onclick="changePage(1)">下一題</button>
        <button id="submit-btn-manual" class="btn btn-submit" onclick="handleFormSubmit()">送出答案</button>
    </div>
    <div id="summary-panel">
        <h2 id="score-title"></h2>
        <p id="summary-msg"></p>
        <button class="btn btn-next" onclick="resetQuiz()">重新開始測驗</button>
    </div>
</div>

<script>
    const originalData = [
        { q: "為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？", o: ["3 月 19 日", "4 月 20 日", "5 月 21 日", "6 月 22 日"], a: 1, r: "解析：為紀念「葉永鋕事件」，教育部自 112 年起訂定每年 4 月 20 日為性別平等教育日，旨在提升校園對多元性別的尊重。" },
        { q: "近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？", o: ["建構韌性防災校園與防災科技資源應用計畫", "2030 雙語國家政策計畫", "推動中小學數位學習精進方案", "建構合作共享的校園圖書館系統中長程計畫"], a: 2, r: "解析：這就是知名的「生生用平板」政策，正式名稱為「推動中小學數位學習精進方案」。" },
        { q: "十二年國教新課綱提到的「跨領域統整課程」是指什麼？", o: ["由不同學科的老師共同教授同一門部定必修課程", "打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習", "學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的課程，以增廣視野", "除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。"], a: 1, r: "解析：跨領域統整強調打破學門界限，協助學生將不同知識進行連結與互動。" },
        { q: "為了推動台灣成為雙語國家，教育部規劃多項措施以平衡偏鄉雙語教育資源不足的問題。請問下列的措施何者為非？", o: ["開出誘因引進雙語師資陣容", "與民間機構合作伴讀計畫", "讓孩子順其自然學習", "運用數位學習平台。"], a: 2, r: "解析：雙語國家政策需有系統地介入與資源投入，「順其自然」並非政策輔助手段。" },
        { q: "近幾年由於青少年偏差行為、憂鬱傾向、自我傷害事件案例日益增多，教育部正努力推動何種教育措施？", o: ["生命教育", "民主教育", "道德教育", "人權教育。"], a: 0, r: "解析：生命教育旨在引導學生探索生存價值、建立正向心理素質，以應對憂鬱與自傷問題。" },
        { q: "在班級經營時，教師不宜運用下列哪一種肢體語言？", o: ["運用身體姿勢以傳達教師的情緒", "運用眼神接觸，提醒聊天的同學停止說話", "走近不專心的同學，讓其注意力集中於課業", "經常碰觸學生身體以表示親切。"], a: 3, r: "解析：為尊重學生身體自主權並避免不必要爭議，教師應避免非必要之肢體接觸。" },
        { q: "下列何者不屬於最新修訂之實驗教育三法？", o: ["《學校型態實驗教育實施條例》", "《高級中等以下教育階段非學校型態實驗教育實施條例》", "《公立高級中等以下學校委託私人辦理實驗教育條例》", "《高級中等學校教育實驗辦法》"], a: 3, r: "解析：實驗教育三法包含「學校型態」、「非學校型態（自學）」及「公立委託私人辦理」。" },
        { q: "依據「兒童及少年福利法」第34條規定，教師知悉有遭受身心虐待之情事者，應立即向直轄市、縣(市)主管機關通報，至遲不得超過多久?", o: ["24小時", "36小時", "48小時", "72小時。"], a: 0, r: "解析：法定義務通報時限為知悉疑似案件後 24 小時內。" },
        { q: "依據師資培育法之規定，為培育教師任教學科、領域、群科專長之專門知能課程，屬於下列何者的定義？", o: ["專門課程", "教育專業課程", "普通課程", "師資職前教育課程。"], a: 0, r: "解析：「專門課程」指學科本體的專業知識（如美術系修美術），「教育專業課程」則是指教學方法課程。" },
        { q: "孩子王阿布要求班上的同學都不可以與他討厭的同學阿達互動，要讓他交不到朋友。阿布的做法，是屬於霸凌分類中的何種霸凌？", o: ["網路霸凌", "肢體霸凌", "言語霸凌", "關係霸凌"], a: 3, r: "解析：排擠、孤立或透過人際關係使其社交受挫，屬於典型的「關係霸凌」。" },
        { q: "近來教育現場倡導翻轉教室（Flipped Classroom）模式方興未艾，請問翻轉教室最主要的理念為何？", o: ["翻轉學生間的程度落差，優先照顧程度差的學生", "翻轉學科間的知識藩籬，採用跨科統整教學模式", "翻轉學校間的資源落差，提供偏鄉學校更多資源", "翻轉學習順序，讓學生先在家看資料影片，再來課堂上討論提問。"], a: 3, r: "解析：翻轉教室強調「課前自學、課中實作」，讓師生在課堂中有更多高階討論時間。" },
        { q: "教育部為導引我國師資培育與教師專業發展，並配合新課綱的內涵，建構新的教師圖像作為教師專業發展的藍圖，此教師圖像稱為終身學習的教師圖像。終身學習的教師圖像分為三大向度，下列何者不是向度的名稱？", o: ["教育愛", "專業力", "未來力", "創新力。"], a: 3, r: "解析：教育部定義的教師圖像三大向度為：教育愛、專業力、未來力。" },
        { q: "自107年開始，有關教育實習的相關規定，以下何者正確？", o: ["師資生必須通過教師資格檢定考後使得參與教育實習", "修畢師資職前教育課程，且通過本校教育專業成長時數審查者得以申請實習", "教育實習成績之評量統一由實習機構評定", "以上皆非。"], a: 0, r: "解析：107年起改採「先檢定後實習」制度，考生須考過教檢方能參加半年實習。" },
        { q: "下列何者不是師資培育中心的學生取得教師證書之途徑？", o: ["修畢師資職前教育課程", "通過教師甄試", "通過教師資格檢定考試", "修畢教育實習課程。"], a: 1, r: "解析：教師甄試是為了考正式老師工作；取得教師證書的條件為修課、過檢、實習。" },
        { q: "我國於 2006 年成為全球第 109 個正式廢除體罰的國家，以保障學生身體自主權，請問零體罰明訂在下列哪項法規中？", o: ["教師法", "兒童及少年福利與權益保障法", "師資培育法", "教育基本法。"], a: 3, r: "解析：《教育基本法》第 8 條第 2 項明確保障學生不受體罰。" },
        { q: "對於學習成就落後的學生實施補救教學，是十二年國教重要政策方案之一，其主要目的為何？", o: ["強化多元文化教育", "促進教育機會均等", "提供更多就業機會", "提升菁英教育水準。"], a: 1, r: "解析：補救教學（學習扶助）是為了弭平起跑點差距，落實教育公平與機會均等。" },
        { q: "根據最新修訂「師資培育之大學及教育實習機構辦理教育實習辦法」，實習學生經師資培育之大學同意，可以在教育實習期間，於機構內擔任補救教學、社團活動指導、監考或其他教學活動，每週累計總節（時）數上限為？", o: ["6", "8", "10", "12"], a: 2, r: "解析：現行法規明定實習學生每週協助教學活動上限為 10 節。" },
        { q: "有關我國目前十二年國民基本教育的敘述，下列何者正確？", o: ["高級中等教育全面免學費。", "分兩階段，國中小階段依據「教育基本法」，高中職階段依據「高級中等教育法」規定辦理。", "重視以學生為中心的教學，全面免試，依據國中畢業生之性向、能力和興趣，提供升學的分流選擇。", "採均一原則，依據「強迫入學條例」，提供普及、強迫入學的國民教育機會。"], a: 1, r: "解析：十二年國教分兩階段，各階段依據其核心法規規範運作。" },
        { q: "教師期望會影響學生的學習效果。下列的相關敘述何者正確？", o: ["教師對學生期望要保持低度標準，減緩學習壓力。", "教師一定要瞭解學生，小心運用自我應驗的預言。", "當學生參與程度較少，可導致學生自我期望較高。", "比馬龍效應，一定會使學生變成自我概念良好的人。"], a: 1, r: "解析：「自我應驗預言」指教師的期望會內化為學生的動力，應給予正向期待。" },
        { q: "未來學校教師除了教學外，尚需針對教學問題進行研究，下列何種研究方法較適合教師使用？", o: ["實驗研究法", "訪談法", "行動研究法", "問卷調查法。"], a: 2, r: "解析：行動研究法強調「在實作中研究、在研究中反思」，最適合一線教師改善教學。" },
        { q: "家長們關心的「性平」議題，請問依據「性別平等教育法」規定，有關國民中學實施性別平等教育課程、教材與教學，下列敘述何者錯誤？", o: ["教材內容應呈現多元之性別觀點", "應利用空白課程進行性別平等教育相關課程或活動", "學校之課程設置及活動設計不得因性別而有差別待遇", "每學期至少實施四小時性別平等教育相關課程或活動。"], a: 1, r: "解析：性平教育應融入各科教學中，並非單獨依賴空白課程實施。" },
        { q: "學校課程中如重視新移民的原生文化，以展現多元文化的精神，主要在落實何種層面的教育政策？", o: ["教育機會均等", "社會化", "社會階層化", "選擇與分配。"], a: 0, r: "解析：尊重原生文化能保障不同族群學生的權利與地位，體現機會均等精神。" },
        { q: "根據我國的《教師法》之規定，下列何者不是屬於教師的義務？", o: ["擔任導師", "參加教師組織", "積極維護學生受教之權益", "從事與教學有關之研究、進修。"], a: 1, r: "解析：參加教師組織是法律賦予教師的「權利」，由教師自由決定是否參加。" },
        { q: "行政院提出「2030 雙語國家」政策藍圖，下列何者不包括在此藍圖中？", o: ["延伸雙語教學至幼兒園", "推動中小學各學科英語授課", "落實中小學英語科全英語授課", "推動雙聯學位等措施，促進教育體系國際化。"], a: 1, r: "解析：政策目前重點在英語學科全英化，其他學科則採雙語化，而非全英語授課。" },
        { q: "全國家長最關心的十大教育議題中，前幾名包含品格教育、校園安全。可見家長現在最重視的議題是？", o: ["親子關係", "培養孩子正確的價值觀", "孩子快樂不快樂", "孩子在學校的成績課業。"], a: 1, r: "解析：家長目前首重孩子在校的品格發展與正確價值觀的引導。" },
        { q: "下列關於學校本位課程的陳述，何者為非?", o: ["學校自主的課程改革", "由中央負責統籌指導", "能發揮學校辦學特色", "結合社區特色發展。"], a: 1, r: "解析：校本課程強調由「各校」自主研發與發展特色，非中央統一指導。" },
        { q: "陳老師很樂於學習新的教學方法與評量方法，並應用於課堂教學活動中。符合教育部教育圖像中的哪個向度？", o: ["教育愛", "專業力", "未來力", "創新力。"], a: 2, r: "解析：勇於嘗試新教學、掌握變革趨勢，是「未來力」的重要體現。" },
        { q: "請問近年十分熱門的 AI 人工智慧科技在教育中的角色是什麼？", o: ["取代教師的角色", "提供更多標準化的學習材料", "限制學生的創意和思維能力", "輔助教育者，提供更具彈性的學習環境"], a: 3, r: "解析：AI 被定位為賦能工具，輔助教師進行更具彈性與個人化的教學。" },
        { q: "台灣雙語教育期待英文教師扮演的角色，何者有誤？", o: ["專業發展者：提升學科教師雙語能力", "同步翻譯者：課堂中逐字將英文翻譯成中文", "經驗分享者：提供雙語互動之成功案例", "專業陪伴者：與學科教師進行教案共備。"], a: 1, r: "解析：雙語教學應強調自然的情境使用，不應淪為呆板的逐字翻譯課程。" },
        { q: "關於學校輔導工作的原則，下列那個原則最不適切？", o: ["每位導師都需要負責輔導工作", "輔導不能獨立於教學活動之外", "科任教師也需要負責輔導工作", "輔導主要工作事項為學習輔導。"], a: 3, r: "解析：輔導包含心理、生活與生涯等多維度，「學習輔導」僅是其中一環。" },
        { q: "下列有關課程、教材與教科書的關係描述，何者有誤?", o: ["教材是課程的一部分。", "教科書和教材互不包含。", "教師製作影片、簡報屬於教材。", "教科書或教材能反映課程的目標。"], a: 1, r: "解析：教科書是教材的一種，兩者是包含關係。" },
        { q: "依據最新修訂《校園霸凌防制準則》，下列說明何者有誤？", o: ["霸凌指個人或集體持續以言語、肢體動作等方式對他人為攻擊行為", "知悉疑似霸凌應至遲於二十四小時內向主管機關通報", "「校園霸凌」定義僅限於相同學校之學生對學生行為", "被霸凌人或其法定代理人得向學校申請調查。"], a: 2, r: "解析：霸凌對象包含「相同或不同學校」之學生。並不侷限於同校。" },
        { q: "高級中等學校學生未經請假或不明原因未到校連續達三日以上者，法律上稱為？", o: ["中途輟學學生(中輟生)", "中途離校學生(中離生)", "長期缺課學生(長缺生)", "不明原因學生(不明生)"], a: 1, r: "解析：高中教育階段通稱為「中離生」；國中小義務教育階段才稱為「中輟生」。" },
        { q: "一位教師想透過實驗知道創新教學策略是否比傳統有效，這位教師使用的是那一種研究類型？", o: ["實驗法", "研究法", "相關法", "描述法。"], a: 0, r: "解析：操作自變項（教學法）並觀察依變項（成效）的因果研究，即為實驗法。" },
        { q: "我國小學、國中與高中採用的「六三三」學制是仿效下列哪個國家？", o: ["日本", "美國", "英國", "德國。"], a: 1, r: "解析：台灣現代學制深受美國制度影響，奠定了 6-3-3 的基礎架構。" },
        { q: "偏鄉國中生會考成績偏低情況反映了資源分配不均，這主要涉及到哪個教育議題？", o: ["終身學習能力", "教師專業能力", "教育機會均等", "家長教育選擇權。"], a: 2, r: "解析：確保每位學生不論背景皆能獲得公平資源，是機會均等的核心。" },
        { q: "有關台灣雙語教育目前推動的重點，何者有誤？", o: ["由校長率先營造雙語環境", "學生具備基礎英語能力後再接受雙語課程", "學科內容仍可根據需要輔以國語授課", "理想狀況是增能英語教師，使其具備學科知識來教導專業學科。"], a: 3, r: "解析：政策重點是增加學科老師的英語力，而非讓英文老師跨領域教物理、化學。" },
        { q: "根據修訂「師資培育之大學辦理教育實習辦法」，實習學生教學實習節數應為專任教師基本教學節數的多少？", o: ["四分之一以上二分之一以下", "六分之一以上二分之一以下", "八分之一以上二分之一以下", "以上皆非。"], a: 1, r: "解析：法規規定實習學生的實習教學節數應為專任老師基本節數之 1/6 到 1/2 間。" },
        { q: "有關台灣雙語教育重點的敘述何者正確？", o: ["雙語教育是採用國語和英語兩種語言進行教學。", "雙語教育完全等同於純英語教學。", "台灣雙語教育目前多採用全沉浸式模式。", "雙語教育目的是要取代母語。"], a: 0, r: "解析：雙語教育意指在教學過程中，兩種語言皆作為知識傳遞與溝通的媒介。" },
        { q: "教師在聘約存續期間，因法規事由（如刑事诉訟等）暫時停止聘約關係者，稱為：", o: ["停聘", "解聘", "不續聘", "懸缺待聘。"], a: 0, r: "解析：「停聘」指暫時中止聘約權利義務；解聘與不續聘則會導致聘約消滅。" }
    ];

    let currentQuizData = [];
    let currentIndex = 0;
    let answers = {};
    let marks = {};
    let isSubmitted = false;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderNav() {
        const nav = document.getElementById('nav-bar');
        nav.innerHTML = '';
        currentQuizData.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.id = `nav-${i}`;
            div.innerText = i + 1;
            div.onclick = () => goToPage(i);
            
            if (isSubmitted) {
                const isCorrect = parseInt(answers[i]) === currentQuizData[i].a;
                div.classList.add(isCorrect ? 'correct' : 'wrong');
            } else if (answers[i] !== undefined) {
                div.classList.add('answered');
            }
            if (marks[i]) div.classList.add('marked');
            if (i === currentIndex) div.classList.add('current');
            nav.appendChild(div);
        });
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentQuizData.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = `quiz-card ${i === currentIndex ? 'active' : ''}`;
            card.id = `card-${i}`;
            let optionsHtml = '';
            item.o.forEach((opt, oi) => {
                const isSelected = answers[i] == oi;
                optionsHtml += `
                    <label class="option-label ${isSelected ? 'selected' : ''}">
                        <input type="radio" name="q${i}" value="${oi}" ${isSelected ? 'checked' : ''} onchange="selectOpt(${i}, ${oi})" ${isSubmitted ? 'disabled' : ''}>
                        <span>${opt}</span>
                    </label>
                `;
            });

            let feedbackHtml = '';
            if (isSubmitted) {
                const isCorrect = parseInt(answers[i]) === item.a;
                feedbackHtml = `
                    <div class="result-box ${isCorrect ? 'correct-box' : 'wrong-box'}" style="display:block">
                        ${isCorrect ? '✅ 答對了！' : '❌ 答錯了！'} <br>
                        <strong>正確答案：${item.o[item.a]}</strong>
                    </div>
                    <div class="reason-box">${item.r}</div>
                `;
            }

            card.innerHTML = `
                <div class="question-header">
                    <div class="question">${i + 1}. ${item.q}</div>
                    <button class="mark-btn ${marks[i] ? 'active' : ''}" onclick="toggleMark(${i})">標記此題 ⚠️</button>
                </div>
                <div class="options-group">${optionsHtml}</div>
                ${feedbackHtml}
            `;
            container.appendChild(card);
        });
        updateButtonVisibility();
    }

    window.selectOpt = function(qi, oi) {
        answers[qi] = oi;
        renderNav();
        renderQuiz();
        saveToLocal();
    };

    window.toggleMark = function(i) {
        marks[i] = !marks[i];
        renderNav();
        renderQuiz();
        saveToLocal();
    };

    window.changePage = function(step) {
        const nextIdx = currentIndex + step;
        if (nextIdx >= 0 && nextIdx < currentQuizData.length) { goToPage(nextIdx); }
    };

    function goToPage(idx) {
        currentIndex = idx;
        renderQuiz();
        renderNav();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateButtonVisibility() {
        document.getElementById('prev-btn').style.visibility = (currentIndex === 0) ? 'hidden' : 'visible';
        document.getElementById('next-btn').style.visibility = (currentIndex === currentQuizData.length - 1) ? 'hidden' : 'visible';
        document.getElementById('submit-btn-manual').style.display = isSubmitted ? 'none' : 'block';
    }

    function saveToLocal() {
        localStorage.setItem('ntua_quiz_final_fixed', JSON.stringify({ data: currentQuizData, answers, marks, isSubmitted }));
    }

    window.handleFormSubmit = function() {
        if (!confirm('確定送出並查看所有解析嗎？')) return;
        executeSubmit();
    };

    function executeSubmit() {
        isSubmitted = true;
        let score = 0;
        currentQuizData.forEach((item, i) => { if (parseInt(answers[i]) === item.a) score++; });
        renderNav(); renderQuiz(); updateButtonVisibility();
        const panel = document.getElementById('summary-panel');
        panel.style.display = 'block';
        document.getElementById('score-title').innerText = `測驗完成！得分：${score} / ${currentQuizData.length}`;
        document.getElementById('summary-msg').innerText = `謝佳杰，恭喜完成本次測驗。點選上方導覽圓圈可查看每題詳細解析。`;
        panel.scrollIntoView({ behavior: 'smooth' });
        saveToLocal();
    }

    window.resetQuiz = function() {
        localStorage.removeItem('ntua_quiz_final_fixed');
        location.reload();
    };

    function init() {
        const saved = localStorage.getItem('ntua_quiz_final_fixed');
        if (saved && confirm('偵測到先前的測驗，要恢復進度嗎？')) {
            const progress = JSON.parse(saved);
            currentQuizData = progress.data; answers = progress.answers; marks = progress.marks; isSubmitted = progress.isSubmitted || false;
            if (isSubmitted) document.getElementById('summary-panel').style.display = 'block';
        } else {
            currentQuizData = shuffle([...originalData]);
        }
        renderNav(); renderQuiz();
    }
    init();
</script>
</body>
</html>
