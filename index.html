<div class="container">
    <h2 style="text-align:center; margin-bottom: 20px; color: #fff; white-space: nowrap;">國立臺北藝術大學師資培育中心甄選題庫系統（114-116）</h2>

<script>
const originalData = [
    { q: "1. 111 學年度起實施之「身心障礙學生無法參與國民體育實施辦法」修正案，關於身心障礙學生參與體育課之敘述，何者錯誤？", o: ["①學校應依學生需求提供無障礙環境及必要之輔具", "②應配合學生個別化教育計畫（IEP）提供體育教學及評量", "③身心障礙學生得申請免修體育課", "④學校得調整體育課之內容、器材、場地及評量方式"], a: 2, r: "新法強調「適應體育」，身心障礙學生不應直接免修體育課，而是應調整教學內容、提供輔具或環境支持，讓其能參與學習。" },
    { q: "2. 下列何者不屬於《教育基本法》所規定的學生權利項目？", o: ["①學習權", "②受教育權", "③身體自主權及人格發展權", "④罷課權"], a: 3, r: "《教育基本法》第 8 條規定，學生享有學習權、受教育權、身體自主權及人格發展權，但並未賦予「罷課權」。" },
    { q: "3. 依據《教師法》規定，教師有下列哪一情境者，學校應予解聘，且終身不得聘任為教師？", o: ["①體罰或霸凌學生，造成其身心嚴重侵害", "②教學不力或不能勝任工作，經輔導改善無效", "③連續請假超過一個月", "④在校外兼課或兼職"], a: 0, r: "涉及體罰或霸凌學生且情節嚴重者，依《教師法》第 14 條規定，應予解聘並終身不得聘任。" },
    { q: "4. 下列何種評量方式最能呈現學生在一段時間內學習成長的軌跡？", o: ["①總結性評量", "②檔案評量", "③安置性評量", "④常模參照評量"], a: 1, r: "檔案評量（Portfolio Assessment）透過蒐集學生作品、反思紀錄，能具體呈現學習過程與進步軌跡。" },
    { q: "5. 在課堂中，老師對回答正確的學生給予「貼紙」獎勵，這在行為主義心理學中屬於何種作用？", o: ["①負增強", "②懲罰", "③正增強", "④消弱"], a: 2, r: "正增強是給予個體喜愛的刺激（貼紙），以增加目標行為（正確回答）出現的頻率。" },
    { q: "6. 皮亞傑(J. Piaget)的認知發展理論中，學生開始展現「邏輯思考能力」，但仍需具體事物輔助，是屬於哪個階段？", o: ["①感覺運動期", "②前運思期", "③具體運思期", "④形式運思期"], a: 2, r: "具體運思期（7-11 歲）已具備邏輯與可逆性，但思考仍侷限於具體事物或經驗。" },
    { q: "7. 維高斯基(L. Vygotsky)提出的「鷹架理論」(Scaffolding)主要發生在下列哪個區域內？", o: ["①自我發展區", "②潛在發展區", "③已知領域區", "④近側發展區(ZPD)"], a: 3, r: "近側發展區（ZPD）是學生獨立解決問題與在成人引導下解決問題間的差距，鷹架即搭建在此區。" },
    { q: "8. 108 課綱的核心素養不包括下列哪一個面向？", o: ["①自主行動", "②溝通互動", "③社會參與", "④學科競爭"], a: 3, r: "三面九項包含「自主行動」、「溝通互動」、「社會參與」，不包含學科競爭。" },
    { q: "9. 「當學生看到同學因為熱心助人被老師稱讚，自己也跟著學習助人行為」，這是屬於班度拉(A. Bandura)提出的何種現象？", o: ["①替代強化", "②自我強化", "③直接強化", "④負強化"], a: 0, r: "替代強化（Vicarious Reinforcement）是指觀察者看到榜樣受獎勵，進而增強了自己的模仿動機。" },
    { q: "10. 老師在教學後進行小考，目的是為了了解學生的學習狀況並及時調整教學。這屬於何種評量？", o: ["①診斷性評量", "②形成性評量", "③總結性評量", "④預測性評量"], a: 1, r: "形成性評量在教學過程中進行，用以提供師生回饋，隨時調整教學節奏。" },
    { q: "11. 依據《少年事件處理法》，下列敘述何者正確？", o: ["①未滿 12 歲之人觸犯刑罰法律，由司法機關處理", "②少年保護事件由民事法庭審理", "③少年事件處理對象為 12 歲以上未滿 18 歲之人", "④少年保護事件之執行由警察機關主導"], a: 2, r: "少年事件處理法對象為 12 歲以上未滿 18 歲。未滿 12 歲回歸教育/社政體系（行政輔導優先）。" },
    { q: "12. 在班級經營中，老師與學生共同訂定規範，讓學生參與決策。這屬於何種領導風格？", o: ["①威權型", "②放任型", "③民主型", "④忽視型"], a: 2, r: "民主型領導強調參與、溝通與協商，有助於培養學生的歸屬感與自治能力。" },
    { q: "13. 加德納(H. Gardner)的多重智能理論中，擅長自我省思、了解自身優缺點的人具備哪種智能？", o: ["①人際智能", "②內省智能", "③邏輯智能", "④空間智能"], a: 1, r: "內省智能（Intrapersonal Intelligence）是指對自我的覺察、自律與反思能力。" },
    { q: "14. 下列何者不是《技術及職業教育法》所強調的重點？", o: ["①推動產學合作", "②落實實作教學", "③僅重視學術研究方案", "④強化職業輔導"], a: 2, r: "技職教育法強調「實作性」與「產業連結」，不應僅偏重學術研究。" },
    { q: "15. 「教育是為了讓靈魂脫離肉體的囚牢，轉向真理之光。」此種教育看法最接近哪位哲學家？", o: ["①柏拉圖(Plato)", "②杜威(Dewey)", "③盧梭(Rousseau)", "④尼采(Nietzsche)"], a: 0, r: "柏拉圖的《理想國》與洞穴寓言說明教育是靈魂轉向（真理）的歷程。" },
    { q: "16. 布魯姆(Bloom)的教育目標分類中，最高層次的認知歷程是？", o: ["①理解", "②分析", "③評鑑", "④創造"], a: 3, r: "新版認知領域目標層次由低至高：記憶、了解、應用、分析、評鑑、創造。" },
    { q: "17. 下列何者不屬於特殊教育法中「資賦優異」的類別？", o: ["①一般智能資賦優異", "②學術性向資賦優異", "③藝術才能資賦優異", "④體育技能卓越"], a: 3, r: "特教法第 4 條資優包含：一般智能、學術性向、藝術才能、創造力、領導才能及其他特殊才藝。" },
    { q: "18. 在處理校園衝突時，老師引導學生表達感受並尋求修復關係，而非僅是處罰。這屬於何種輔導理念？", o: ["①威懾主義", "②修復式正義", "③應報主義", "④功利主義"], a: 1, r: "修復式正義強調受損關係的修復與對話，讓行為人了解責任並與受害者達成和解。" },
    { q: "19. 根據《性別平等教育法》，校園性侵害、性騷擾或性霸凌事件應於多少小時內向主管機關通報？", o: ["①12 小時", "②24 小時", "③48 小時", "④72 小時"], a: 1, r: "依規定應於 24 小時內完成法定通報。" },
    { q: "20. 杜威(J. Dewey)主張「教育即生活」，強調學生應透過何種方式學習？", o: ["①背誦經典", "②做中學(Learning by doing)", "③感官隔離", "④被動接收知識"], a: 1, r: "杜威實驗主義強調經驗、問題解決與實際動手作的過程。" },
    { q: "21. 師資培育之大學辦理師資職前教育課程，應報請何機關核定？", o: ["①各縣市政府教育局", "②師資培育大學校長室", "③教育部", "④行政院"], a: 2, r: "師資職前教育課程及招生名額皆需由教育部核定。" },
    { q: "22. 「比馬龍效應」(Pygmalion Effect)在教育上的啟示為何？", o: ["①學生的智力是天生的", "②教師的期待會影響學生的表現", "③環境是學習的唯一因素", "④處罰比獎勵更有效"], a: 1, r: "又稱自我實現預言，教師對學生的正面期待往往能引發學生的進步。" },
    { q: "23. 下列何種教學法強調學生透過發現問題、提出假設、驗證假設來建構知識？", o: ["①講述教學法", "②編序教學法", "③探究教學法", "④練習教學法"], a: 2, r: "探究教學法（Inquiry-based learning）強調主動發現與科學探究的精神。" },
    { q: "24. 依據《教師請假規則》，教師因公傷假，每次最長以幾年為限？", o: ["①半年", "②一年", "③二年", "④三年"], a: 2, r: "教師公傷假每次最長兩年。" },
    { q: "25. 108 課綱中，關於「彈性學習課程」的規劃，下列敘述何者正確？", o: ["①只能用來加強國、數、英學科", "②由教育部統一規定課程內容", "③由各校自行規劃，包含統整性主題課程等", "④學生不可以參與選擇"], a: 2, r: "彈性學習課程旨在落實學校願景與特色，由學校課發會審核規劃。" },
    { q: "26. 斯金納(B.F. Skinner)的編序教學法是基於何種學習理論？", o: ["①認知主義", "②建構主義", "③行為主義", "④人本主義"], a: 2, r: "編序教學運用了操作制約（連續減除法）與立即回饋的原理。" },
    { q: "27. 在多元文化教育中，教師將不同族群的節慶、英雄帶進課程，這屬於 Banks 的哪一個發展階段？", o: ["①貢獻模式", "②附加模式", "③轉化模式", "④社會行動模式"], a: 0, r: "貢獻模式是最基礎的，僅將少數族群的內容加入主流課程，架構不變。" },
    { q: "28. 有關「校園霸凌」的定義，下列敘述何者錯誤？", o: ["①具備持續性", "②具有傷害意圖", "③權力不對等", "④僅限於身體上的毆打"], a: 3, r: "霸凌包含言語、肢體、關係（排擠）、網路等多元形式，非僅限身體接觸。" },
    { q: "29. 主張教育應以「學生為中心」，重視個人自由與責任，是何種哲學流派？", o: ["①存在主義", "②實證主義", "③理性主義", "④結構主義"], a: 0, r: "存在主義（Existentialism）強調個體的存在先於本質，強調選擇與自由。" },
    { q: "30. 教師進行「反思教學」(Reflective Teaching)的主要目的是？", o: ["①向學生炫耀知識", "②滿足學校行政要求", "③持續檢視並改善自己的教學實務", "④為了通過評鑑"], a: 2, r: "反思教學是教師專業成長的核心，旨在改進教學效能。" },
    { q: "31. 在輔導室的工作中，針對「一般學生」進行的預防性輔導稱為？", o: ["①初級預防", "②二級預防", "③三級預防", "④追蹤輔導"], a: 0, r: "初級預防（發展性輔導）針對全體學生；二級為介入性（高風險）；三級為處遇性（個案執行）。" },
    { q: "32. 依據最新修訂《校園霸凌防制準則》，下列說明何者有誤？", o: ["①「霸凌」定義包含直接或間接對他人故意為貶抑、排擠等行為。", "②教職員工知悉疑似校園霸凌事件時，應於二十四小時內向權責人員通報。", "③「校園霸凌」僅指相同學校學生對學生，於校園內所發生之霸凌行為。", "④被霸凌人得向行為人於行為發生時所屬之學校申請調查。"], a: 2, r: "修正後之校園霸凌包含相同或不同學校之校長、教職員工及學生對學生之行為。" },
    { q: "33. 根據法規：高級中等學校學生未經請假或不明原因未到校上課連續達三日以上者稱為何種類型學生？", o: ["①中途輟學學生(中輟生)", "②中途離校學生(中離生)", "③長期缺課學生(長缺生)", "④不明原因學生(不明生)。"], a: 1, r: "高中階段稱為「中離生」；國中小義務教育階段才稱為「中輟生」。" },
    { q: "34. 下列何者不符合 108 課綱「自主行動」面向的內容？", o: ["①身心素質與自我精進", "②系統思考與解決問題", "③規畫執行與創新應變", "④符號運用與溝通表達"], a: 3, r: "「符號運用與溝通表達」屬於「溝通互動」面向。" },
    { q: "35. 在德育教學中，柯爾伯格(L. Kohlberg)主張道德發展有三個水準六個階段，最高階段是？", o: ["①法律與秩序取向", "②社會契約取向", "③普遍倫理原則取向", "④避罰服從取向"], a: 2, r: "第六階段為普遍性道德倫理原則取向，個體依照自選的倫理原則及良心行事。" },
    { q: "36. 關於「性別平等教育委員會」之設置，下列敘述何者錯誤？", o: ["①女性委員應占委員總數二分之一以上", "②置委員五人至二十一人", "③主任委員由學校校長擔任", "④學生代表不得參與"], a: 3, r: "學校性平會應有學生代表參與（視法規層級與各校章程，通常包含學生代表）。" },
    { q: "37. 老師在課堂上透過對話、提問引導學生自行推導出正確概念，這源自於何種教育法？", o: ["①產婆法", "②精熟教學法", "③個別化教學法", "④直觀教學法"], a: 0, r: "蘇格拉底（Socrates）的產婆法（產出法），強調透過詰問與辯證導出真理。" },
    { q: "38. 有關特教學生「個別化教育計畫」(IEP)，下列敘述何者有誤？", o: ["①應由專業團隊參與訂定", "②每學期至少檢討一次", "③僅適用於資賦優異學生", "④內容包含學生的學習目標、輔導方式及支持服務"], a: 2, r: "IEP 專用於身心障礙學生；資優學生使用的稱為個別輔導計畫（IGP）。" },
    { q: "39. 有關「實驗教育」的類型，下列何者不包含在現行法規中？", o: ["①學校型態實驗教育", "②非學校型態實驗教育", "③公立學校委託私人辦理實驗教育", "④私人醫院附設實驗教育"], a: 3, r: "台灣實驗教育三法包含：學校型態、非學校型態（個人/團體/機構）及公立學校委派私人辦理。" },
    { q: "40. 依據《教育基本法》之規定，下列何者為教育之主體？", o: ["①老師", "②家長", "③學生", "④政府"], a: 2, r: "《教育基本法》第 2 條明確規定「學生為教育之主體」。" }
];
<script>
    let currentQuiz = 0;
    let userAnswers = new Array(originalData.length).fill(null);
    let markedQuestions = new Array(originalData.length).fill(false);

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        const navBar = document.getElementById('nav-bar');
        
        originalData.forEach((item, index) => {
            // 建立導航按鈕
            const navBtn = document.createElement('div');
            navBtn.className = 'nav-item';
            navBtn.id = `nav-${index}`;
            navBtn.innerText = index + 1;
            navBtn.onclick = () => changePage(index);
            navBar.appendChild(navBtn);

            // 建立題目卡片
            const card = document.createElement('div');
            card.className = `quiz-card ${index === 0 ? 'active' : ''}`;
            card.id = `card-${index}`;

            let optionsHtml = '';
            item.o.forEach((opt, optIdx) => {
                optionsHtml += `
                    <label class="option-label" id="label-${index}-${optIdx}">
                        <input type="radio" name="q${index}" onclick="selectOption(${index}, ${optIdx})">
                        <span>${opt}</span>
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="question-header">
                    <div class="question">${item.q}</div>
                    <button class="mark-btn" id="mark-${index}" onclick="toggleMark(${index})">標記此題</button>
                </div>
                <div class="options-group">${optionsHtml}</div>
                <div class="result-box" id="result-${index}"></div>
                <div class="reason-box" id="reason-${index}"><strong>【解析】</strong><br>${item.r}</div>
            `;
            container.appendChild(card);
        });
        updateNavStatus();
    }

    function selectOption(qIdx, oIdx) {
        // 如果該題已經點選過，則不重複執行（鎖定答案）
        if (userAnswers[qIdx] !== null) return;

        userAnswers[qIdx] = oIdx;
        const item = originalData[qIdx];
        const resultBox = document.getElementById(`result-${qIdx}`);
        const reasonBox = document.getElementById(`reason-${qIdx}`);
        const navBtn = document.getElementById(`nav-${qIdx}`);

        // 立即顯示解析框
        resultBox.style.display = "block";
        reasonBox.style.display = "block";

        // 判斷正確或錯誤
        if (oIdx === item.a) {
            resultBox.className = "result-box correct-box";
            resultBox.innerText = "⭐ 正確！";
            navBtn.classList.add('correct'); // 導航鈕變綠色
        } else {
            resultBox.className = "result-box wrong-box";
            resultBox.innerText = `❌ 錯誤。正確答案是：${item.o[item.a]}`;
            navBtn.classList.add('wrong'); // 導航鈕變紅色
            // 將點選錯誤的選項框加一點提示色
            document.getElementById(`label-${qIdx}-${oIdx}`).style.borderColor = "#f44336";
        }
        
        // 將正確答案的框框亮起來
        document.getElementById(`label-${qIdx}-${item.a}`).style.borderColor = "#4caf50";
        document.getElementById(`label-${qIdx}-${item.a}`).style.borderWidth = "3px";

        // 鎖定該題所有選項不可再點選
        const inputs = document.querySelectorAll(`#card-${qIdx} input`);
        inputs.forEach(input => input.disabled = true);
    }

    function toggleMark(index) {
        markedQuestions[index] = !markedQuestions[index];
        const btn = document.getElementById(`mark-${index}`);
        btn.classList.toggle('active');
        updateNavStatus();
    }

    function changePage(index) {
        document.querySelector('.quiz-card.active').classList.remove('active');
        document.getElementById(`card-${index}`).classList.add('active');
        currentQuiz = index;
        updateNavStatus();
    }

    function move(step) {
        let target = currentQuiz + step;
        if (target >= 0 && target < originalData.length) {
            changePage(target);
        }
    }

    function updateNavStatus() {
        originalData.forEach((_, index) => {
            const navBtn = document.getElementById(`nav-${index}`);
            navBtn.classList.remove('current', 'marked');
            if (index === currentQuiz) navBtn.classList.add('current');
            if (markedQuestions[index]) navBtn.classList.add('marked');
        });
    }

    function handleFormSubmit() {
        const unansweredCount = userAnswers.filter(a => a === null).length;
        if (unansweredCount > 0) {
            if (!confirm(`還有 ${unansweredCount} 題尚未回答，確定要結束練習並查看總分嗎？`)) return;
        }
        
        let score = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === originalData[idx].a) score++;
        });

        const scorePercent = Math.round((score / originalData.length) * 100);
        document.getElementById('quiz-container').style.display = 'none';
        document.querySelector('.nav-btns').style.display = 'none';
        document.getElementById('nav-bar').style.display = 'none';
        
        const summary = document.getElementById('summary-panel');
        summary.style.display = 'block';
        summary.innerHTML = `
            <h1 style="color:#bb86fc;">測驗結束</h1>
            <div style="font-size: 3rem; margin: 20px 0;">${scorePercent} 分</div>
            <p style="font-size: 1.2rem;">正確題數：${score} / ${originalData.length}</p>
            <button class="btn btn-next" onclick="location.reload()" style="margin-top:20px;">重新練習</button>
        `;
    }

    window.onload = initQuiz;
</script>
</body>
</html>
