<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教育議題與法規測驗 - 完整版</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .question-block { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .option { display: block; margin: 10px 0; padding: 10px; border: 1px solid #eee; cursor: pointer; border-radius: 4px; }
        .option:hover { background: #f0f7ff; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 4px; display: none; font-weight: bold; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .wrong { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        h1 { color: #2c3e50; text-align: center; }
        #final-summary { display: none; margin-top: 40px; padding: 20px; background: #e7f3ff; border: 2px solid #b8daff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>教育議題與法規綜合能力測驗</h1>
        <p style="text-align:center;">（40 題完整版）</p>
        <div id="quiz-container"></div>
        <div id="final-summary">
            <h3>測驗結語</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        // 40 題完整資料直接嵌入
        const quizData = [
            { q: "為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？", options: ["3 月 19 日", "4 月 20 日", "5 月 21 日", "6 月 22 日"], ans: 1, note: "為紀念葉永鋕事件並推動性別平等教育，教育部將此日訂為性別平等教育日。" },
            { q: "近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？", options: ["建構韌性防災校園與防災科技資源應用計畫", "2030 雙語國家政策計畫", "推動中小學數位學習精進方案", "建構合作共享的校園圖書館系統中長程計畫"], ans: 2, note: "此方案即所謂的「班班有網路，生生用平板」，重點在於數位學習資源與硬體的充實。" },
            { q: "十二年國教新課綱提到的「跨領域統整課程」是指什麼？", options: ["由不同學科的老師共同教授同一門部定必修課程", "打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習", "學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的課程，以增廣視野", "除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。"], ans: 1, note: "跨領域統整的核心在於串連不同學門知識，幫助學生進行整合性學習。" },
            { q: "為了推動台灣成為雙語國家，教育部規劃多項措施以平衡偏鄉雙語教育資源不足的問題。請問下列的措施何者為非？", options: ["開出誘因引進雙語師資陣容", "與民間機構合作伴讀計畫", "讓孩子順其自然學習", "運用數位學習平台。"], ans: 2, note: "政府需有具體介入與支持措施，而非放任「順其自然」，這無法解決資源不平等問題。" },
            { q: "近幾年由於青少年偏差行為、憂鬱傾向、自我傷害事件案例日益增多，教育部正努力推動何種教育措施？", options: ["生命教育", "民主教育", "道德教育", "人權教育。"], ans: 0, note: "生命教育旨在引導學生探索生命意義，並建立自尊、自愛與情緒調適能力。" },
            { q: "在班級經營時，教師不宜運用下列哪一種肢體語言？", options: ["運用身體姿勢以傳達教師的情緒", "運用眼神接觸，提醒聊天的同學停止說話", "走近不專心的同學，讓其注意力集中於課業", "經常碰觸學生身體以表示親切。"], ans: 3, note: "頻繁的肢體接觸容易引發性別或權力界限的爭議，在現代教育環境中並不適宜。" },
            { q: "下列何者不屬於最新修訂之實驗教育三法？", options: ["《學校型態實驗教育實施條例》", "《高級中等以下教育階段非學校型態實驗教育實施條例》", "《公立高級中等以下學校委託私人辦理實驗教育條例》", "《高級中等學校教育實驗辦法》"], ans: 3, note: "此為較早期的個別辦法，位階與屬性不屬於目前通稱的實驗教育三法條例。" },
            { q: "依據「兒童及少年福利法」第34條規定，教師知悉有遭受身心虐待之情事者，應立即向直轄市、縣(市)主管機關通報，至遲不得超過多久?", options: ["24小時", "36小時", "48小時", "72小時。"], ans: 0, note: "法規要求知悉虐待案件必須在24小時內完成責任通報，以保護兒少安全。" },
            { q: "依據師資培育法之規定，為培育教師任教學科、領域、群科專長之專門知能課程，屬於下列何者的定義？", options: ["專門課程", "教育專業課程", "普通課程", "師資職前教育課程。"], ans: 0, note: "專門課程即是指針對未來任教科目（如數學、國文）的本學科專業知識學習。" },
            { q: "孩子王阿布要求班上的同學都不可以與他討厭的同學阿達互動，要讓他交不到朋友。阿布的做法，是屬於霸凌分類中的何種霸凌？", options: ["網路霸凌", "肢體霸凌", "言語霸凌", "關係霸凌"], ans: 3, note: "關係霸凌是指透過排擠、散播謠言或操弄人際關係來孤立他人。" },
            { q: "近來教育現場倡導翻轉教室（Flipped Classroom）模式方興未艾，請問翻轉教室最主要的理念為何？", options: ["翻轉學生間的程度落差", "翻轉學科間的知識藩籬", "翻轉學校間的資源落差", "翻轉學習順序，讓學生先在家看資料，再來課堂討論。"], ans: 3, note: "翻轉教室強調「家裡聽講、教室寫作業」，將傳統授課流程反轉。" },
            { q: "教育部公佈終身學習的教師圖像分為三大向度，下列何者不是？", options: ["教育愛", "專業力", "未來力", "創新力。"], ans: 3, note: "創新力雖重要，但非官方定義的三大向度名稱（教育愛、專業力、未來力）。" },
            { q: "自107年開始，有關教育實習的相關規定，以下何者正確？", options: ["師資生必須通過教師資格檢定考後使得參與教育實習", "修畢課程且通過時數審查即可", "成績統一由實習機構評定", "以上皆非。"], ans: 0, note: "自107年起改為「先考後實習」制。" },
            { q: "下列何者不是師資培育中心的學生取得教師證書之途徑？", options: ["修畢師資職前教育課程", "通過教師甄試", "通過教師資格檢定考試", "修畢教育實習課程。"], ans: 1, note: "教師甄試是為了取得「教職」，而非「教師證書」。" },
            { q: "我國零體罰明訂在下列哪項法規中？", options: ["教師法", "兒童及少年福利與權益保障法", "師資培育法", "教育基本法。"], ans: 3, note: "2006年修正《教育基本法》，明文規定國家應保障學生不受體罰。" },
            { q: "補救教學的主要目的為何？", options: ["強化多元文化教育", "促進教育機會均等", "提供更多就業機會", "提升菁英教育水準。"], ans: 1, note: "確保每個孩子都能獲得必要資源達成基礎學習目標。" },
            { q: "實習學生在機構內擔任補救教學、監考等，每週累計總節數上限為？", options: ["6", "8", "10", "12"], ans: 2, note: "法規規定實習學生擔任特定教學活動之總節數上限為10節。" },
            { q: "有關我國目前十二年國民基本教育的敘述，下列何者正確？", options: ["全面免學費", "分兩階段，國中小依教育基本法，高中職依高級中等教育法。", "全面免試", "強迫入學涵蓋高中"], ans: 1, note: "這正確描述了現行十二年國教在法源上的階段性區分。" },
            { q: "關於教師期望（比馬龍效應）的敘述何者正確？", options: ["期望要保持低標準", "教師要瞭解學生，小心運用自我應驗預言。", "參與程度少導致期望高", "一定會使學生自我概念良好"], ans: 1, note: "自我應驗預言有正負效應，教師應謹慎運用專業敏感度。" },
            { q: "下列何種研究方法較適合現場教師針對教學問題進行研究？", options: ["實驗研究法", "訪談法", "行動研究法", "問卷調查法。"], ans: 2, note: "行動研究強調在實務中發現問題、行動並反思，最適合一線教師。" },
            { q: "依據「性別平等教育法」，下列敘述何者錯誤？", options: ["教材應呈現多元觀點", "應利用空白課程進行性平教育", "不得因性別有差別待遇", "每學期至少實施四小時。"], ans: 1, note: "性平教育應融入課程並有固定時數，不應僅依賴空白課程。" },
            { q: "學校課程重視新移民原生文化展現多元精神，是在落實？", options: ["教育機會均等", "社會化", "社會階層化", "選擇與分配。"], ans: 0, note: "透過認同多元文化，讓不同背景學生獲得尊嚴與資源平等。" },
            { q: "根據《教師法》，下列何者「不是」教師的義務？", options: ["擔任導師", "參加教師組織", "維護學生受教權益", "從事教學有關之研究進修。"], ans: 1, note: "參加教師組織是教師的「權利」，非「義務」。" },
            { q: "行政院「2030 雙語國家」政策藍圖中，「不包括」哪一項？", options: ["延伸至幼兒園", "中小學各學科全英語授課", "落實英語科全英語授課", "推動雙聯學位。"], ans: 1, note: "並非要求「所有學科」都用英語授課，而是推動部分學科雙語教學。" },
            { q: "家長最重視的教育議題第一名是？", options: ["親子關係", "品格教育（價值觀）", "心理健康", "成績課業。"], ans: 1, note: "統計顯示品格教育長期位居全國家長關注議題首位。" },
            { q: "關於學校本位課程的陳述，何者為非?", options: ["學校自主改革", "由中央負責統籌指導", "發揮學校特色", "結合社區發展。"], ans: 1, note: "校本課程強調學校的彈性與自主性。" },
            { q: "教師主動學習新教學法並應用，符合圖像中哪個向度？", options: ["教育愛", "專業力", "未來力", "批判力。"], ans: 2, note: "未來力包含持續學習與應對變遷的彈性。" },
            { q: "AI 人工智慧科技在教育中的角色是？", options: ["取代教師", "提供標準化材料", "限制學生創意", "輔助教育者提供彈性環境。"], ans: 3, note: "AI 是有力的輔助工具，能協助適性教學。" },
            { q: "雙語教育中，英文教師的角色何者有誤？", options: ["專業發展者", "同步翻譯者（英文講完再講中文）", "經驗分享者", "專業陪伴者。"], ans: 1, note: "翻譯會讓學生產生依賴，不利於語言習得。" },
            { q: "輔導工作原則，下列哪個最不適切？", options: ["導師需負責輔導", "不能獨立於教學外", "科任老師也需負責", "主要工作為學習輔導。"], ans: 3, note: "輔導包含生活、心理、生涯，不能窄化為僅限學習。" },
            { q: "關於課程、教材與教科書的關係何者有誤?", options: ["教材是課程的一部分", "教科書和教材互不包含", "教師簡報屬於教材", "教材反映課程目標。"], ans: 1, note: "教科書包含在教材範疇之內。" },
            { q: "依據最新《校園霸凌防制準則》，何者有誤？", options: ["霸凌指持續貶抑排擠行為", "知悉需24小時內通報", "師對生亦屬於「校園霸凌」定義", "被霸凌人可申請調查。"], ans: 2, note: "新準則已將「師對生」不當對待與「學生間霸凌」區分處理。" },
            { q: "高中學生未經請假無故缺課連三日以上稱為？", options: ["中輟生", "中離生", "長缺生", "不明生。"], ans: 1, note: "高中職階段法定術語為「中途離校學生」。" },
            { q: "比較兩班不同教學策略成效的研究屬於？", options: ["實驗法", "研究法", "相關法", "描述法。"], ans: 0, note: "操弄變項並比較結果是典型的實驗研究。" },
            { q: "我國「六三三」學制主要是仿效哪個國家？", options: ["日本", "美國", "英國", "德國。"], ans: 1, note: "台灣現代學制深受美國教育系統影響。" },
            { q: "偏鄉會考成績偏低涉及什麼議題？", options: ["終身學習", "教師專業", "教育機會均等", "家長選擇權。"], ans: 2, note: "城鄉落差是落實機會均等的重大挑戰。" },
            { q: "關於台灣雙語教育推動重點何者有誤？", options: ["校長率先使用雙語", "英語打底後接受雙語教育", "學科內容可以國語授課", "理想是英文老師去教專業學科。"], ans: 3, note: "應是「增能學科教師的英語力」而非讓英文老師教專業學科。" },
            { q: "實習學生教學節數應為專任教師基本節數的？", options: ["1/4~1/2", "1/6~1/2", "1/8~1/2", "以上皆非。"], ans: 1, note: "這是 107 年最新法規修訂的比例。" },
            { q: "雙語教育的敘述何者正確？", options: ["採用國語和英語兩種語言進行教學", "就是英語教學", "全套套用加拿大模式", "就是全英語教學。"], ans: 0, note: "強調兩者兼顧的語言應用環境。" },
            { q: "教師違反重大情事被「暫時停止」聘約關係稱為？", options: ["停聘", "解聘", "不續聘", "懸缺。"], ans: 0, note: "「暫時停止」對應的法律術語即為停聘。" }
        ];

        const summaryText = "謝佳杰，太棒了！你完成了這份 40 題完整練習，這顯示你對教育法規與教學趨勢有極佳的掌握度。建議針對「雙語教育」與「新修訂法規」細節持續保持關注。加油！（較建議此版本）";

        const container = document.getElementById('quiz-container');
        let solved = 0;

        function init() {
            quizData.forEach((item, idx) => {
                const qBox = document.createElement('div');
                qBox.className = 'question-block';
                qBox.innerHTML = `<strong>Q${idx+1}. ${item.q}</strong><div id="opts-${idx}"></div><div id="fb-${idx}" class="feedback"></div>`;
                container.appendChild(qBox);

                const optContainer = document.getElementById(`opts-${idx}`);
                item.options.forEach((optText, optIdx) => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.innerText = optText;
                    btn.onclick = () => checkAnswer(idx, optIdx);
                    optContainer.appendChild(btn);
                });
            });
        }

        function checkAnswer(qIdx, selectedIdx) {
            const item = quizData[qIdx];
            const fb = document.getElementById(`fb-${qIdx}`);
            const opts = document.getElementById(`opts-${qIdx}`).children;

            // 禁用點選
            for(let i=0; i<opts.length; i++) opts[i].style.pointerEvents = 'none';

            fb.style.display = 'block';
            if (selectedIdx === item.ans) {
                fb.className = 'feedback correct';
                fb.innerHTML = '✅ 正確！<br>' + item.note;
            } else {
                fb.className = 'feedback wrong';
                fb.innerHTML = '❌ 錯誤（正確答案是：' + item.options[item.ans] + '）<br>' + item.note;
            }

            solved++;
            if (solved === quizData.length) {
                document.getElementById('final-summary').style.display = 'block';
                document.getElementById('summary-text').innerText = summaryText;
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        init();
    </script>
</body>
</html>
