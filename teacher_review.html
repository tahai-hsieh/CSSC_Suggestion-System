    <script>
        const quizData = {
            "questions": [
                {"question": "為引導學校深化性別平等教育，建構性別友善校園環境，教育部訂哪一天為「性別平等教育日」？", "options": [{"text": "3 月 19 日", "isCorrect": false, "rationale": "這不是教育部規定的性別平等教育日。"}, {"text": "4 月 20 日", "isCorrect": true, "rationale": "為紀念葉永鋕事件並推動性別平等教育，教育部將此日訂為性別平等教育日。"}, {"text": "5 月 21 日", "isCorrect": false, "rationale": "此日期與性別平等教育日的設定無關。"}, {"text": "6 月 22 日", "isCorrect": false, "rationale": "此日期並非性別平等教育日。"}]},
                {"question": "近年來國小、國中、高級中等教育學校分別購置數位學習行動載具及行動充電車，主要係配合教育部何方案計畫施行？", "options": [{"text": "建構韌性防災校園與防災科技資源應用計畫", "isCorrect": false, "rationale": "防災計畫主要針對校園安全與環境，而非數位載具的普及。"}, {"text": "2030 雙語國家政策計畫", "isCorrect": false, "rationale": "此計畫重點在於語言能力的提升，而非硬體設備的全面配置。"}, {"text": "推動中小學數位學習精進方案", "isCorrect": true, "rationale": "此方案即所謂的「班班有網路，生生用平板」，重點在於數位學習資源與硬體的充實。"}, {"text": "建構合作共享的校園圖書館系統中長程計畫", "isCorrect": false, "rationale": "圖書館計畫重點在於書籍與資訊共享，而非每位學生的數位學習載具。"}]},
                {"question": "十二年國教新課綱提到的「跨領域統整課程」是指什麼？", "options": [{"text": "由不同學科的老師共同教授同一門部定必修課程", "isCorrect": false, "rationale": "這屬於協同教學的模式之一，不完全等同於跨領域統整的核心定義。"}, {"text": "打破單一特定學門的界限，提供學生各種可能的學科領域連結互動的學習", "isCorrect": true, "rationale": "跨領域統整的核心在於串連不同學門知識，幫助學生進行整合性學習。"}, {"text": "學生所修習的必修課程必須包含語文、社會、自然科學、藝術等不同領域的課程，以增廣視野", "isCorrect": false, "rationale": "這僅是課程結構的通才要求，而非「跨領域統整」的教學實施方式。"}, {"text": "除了部定必修課程外，學生必須選修有別於部定必修的領域之課程。", "isCorrect": false, "rationale": "這描述的是多元選修或彈性學習，而非領域間的知識整合。"}]},
                {"question": "為了推動台灣成為雙語國家，教育部規劃多項措施以平衡偏鄉雙語教育資源不足的問題。請問下列的措施何者為非？", "options": [{"text": "開出誘因引進雙語師資陣容", "isCorrect": false, "rationale": "這是目前推動雙語教育，特別是針對偏鄉地區補足師資的具體策略。"}, {"text": "與民間機構合作伴讀計畫", "isCorrect": false, "rationale": "引進民間資源協助偏鄉學生學習英語是政策的一部分。"}, {"text": "讓孩子順其自然學習", "isCorrect": true, "rationale": "政府需有具體介入與支持措施，而非放任「順其自然」，這無法解決資源不平等問題。"}, {"text": "運用數位學習平台。", "isCorrect": false, "rationale": "數位資源能跨越地理限制，是縮減偏鄉落差的重要科技手段。"}]},
                {"question": "近幾年由於青少年偏差行為、憂鬱傾向、自我傷害事件案例日益增多，教育部正努力推動何種教育措施？", "options": [{"text": "生命教育", "isCorrect": true, "rationale": "生命教育旨在引導學生探索生命意義，並建立自尊、自愛與情緒調適能力。"}, {"text": "民主教育", "isCorrect": false, "rationale": "民主教育側重公民權利與法治精神，非直接針對心理健康與自我傷害。"}, {"text": "道德教育", "isCorrect": false, "rationale": "道德教育強調社會規範，對於個人內在情緒與憂鬱傾向的直接輔導功能有限。"}, {"text": "人權教育。", "isCorrect": false, "rationale": "人權教育著重平等與尊重，非核心針對青少年自我傷害事件的預防。"}]},
                {"question": "在班級經營時，教師不宜運用下列哪一種肢體語言？", "options": [{"text": "運用身體姿勢以傳達教師的情緒", "isCorrect": false, "rationale": "這能輔助言語溝通，讓學生清楚理解教師當下的態度。"}, {"text": "運用眼神接觸，提醒聊天的同學停止說話", "isCorrect": false, "rationale": "眼神接觸是專業的班級管理技巧，能在不中斷教學下達到提醒效果。"}, {"text": "走近不專心的同學，讓其注意力集中於課業", "isCorrect": false, "rationale": "透過近距離的存在（Proximity Control）可以引導學生重回課堂，是有效的方法。"}, {"text": "經常碰觸學生身體以表示親切。", "isCorrect": true, "rationale": "頻繁的肢體接觸容易引發性別或權力界限的爭議，在現代教育環境中並不適宜。"}]},
                {"question": "下列何者不屬於最新修訂之實驗教育三法？", "options": [{"text": "《學校型態實驗教育實施條例》", "isCorrect": false, "rationale": "這是實驗教育三法之一，對公私立學校轉型實驗教育進行規範。"}, {"text": "《高級中等以下教育階段非學校型態實驗教育實施條例》", "isCorrect": false, "rationale": "這是實驗教育三法之一，針對自學等非學校型態進行規範。"}, {"text": "《公立高級中等以下學校委託私人辦理實驗教育條例》", "isCorrect": false, "rationale": "這是實驗教育三法之一，俗稱公辦民營相關條例。"}, {"text": "《高級中等學校教育實驗辦法》", "isCorrect": true, "rationale": "此為較早期的個別辦法，位階與屬性不屬於目前通稱的實驗教育三法條例。"}]},
                {"question": "依據「兒童及少年福利法」第34條規定，教師知悉有遭受身心虐待之情事者，應立即向直轄市、縣(市)主管機關通報，至遲不得超過多久?", "options": [{"text": "24小時", "isCorrect": true, "rationale": "法規要求知悉虐待案件必須在24小時內完成責任通報，以保護兒少安全。"}, {"text": "36小時", "isCorrect": false, "rationale": "此時限超過了法規要求的24小時通報門檻。"}, {"text": "48小時", "isCorrect": false, "rationale": "對於具急迫性的虐待案件，48小時通報已過於遲緩。"}, {"text": "72小時。", "isCorrect": false, "rationale": "法規設定的是最嚴格的24小時時限，非72小時。"}]},
                {"question": "依據師資培育法之規定，為培育教師任教學科、領域、群科專長之專門知能課程，屬於下列何者的定義？", "options": [{"text": "專門課程", "isCorrect": true, "rationale": "專門課程即是指針對未來任教科目（如數學、國文）的本學科專業知識學習。"}, {"text": "教育專業課程", "isCorrect": false, "rationale": "教育專業課程主要學習教學法、心理學等教育技能，而非學科知識。"}, {"text": "普通課程", "isCorrect": false, "rationale": "普通課程指一般的大學通識或通才教育。"}, {"text": "師資職前教育課程。", "isCorrect": false, "rationale": "這是一個大範疇，包含了專門課程、教育專業課程等，並非單指學科專長。"}]},
                {"question": "孩子王阿布要求班上的同學都不可以與他討厭的同學阿達互動，要讓他交不到朋友。阿布的做法，是屬於霸凌分類中的何種霸凌？", "options": [{"text": "網路霸凌", "isCorrect": false, "rationale": "網路霸凌需涉及電子通訊設備，阿布的行為是實體的社交排擠。"}, {"text": "肢體霸凌", "isCorrect": false, "rationale": "肢體霸凌涉及身體攻擊或財務損壞，阿布並未動手。"}, {"text": "言語霸凌", "isCorrect": false, "rationale": "雖然可能有言語威脅，但其核心目的是切斷社交關係。"}, {"text": "關係霸凌", "isCorrect": true, "rationale": "關係霸凌是指透過排擠、散播謠言或操弄人際關係來孤立他人。"}]},
                {"question": "近來教育現場倡導翻轉教室（Flipped Classroom）模式方興未艾，請問翻轉教室最主要的理念為何？", "options": [{"text": "翻轉學生間的程度落差，優先照顧程度差的學生", "isCorrect": false, "rationale": "雖然有助於個別化學習，但這不是其定義上的主要教學流程變化。"}, {"text": "翻轉學科間的知識藩籬，採用跨科統整教學模式", "isCorrect": false, "rationale": "這屬於跨領域教學，而非「翻轉」課程的執行順序。"}, {"text": "翻轉學校間的資源落差，提供偏鄉學校更多資源", "isCorrect": false, "rationale": "這是教育行政的任務，非課堂教學模式的轉變。"}, {"text": "翻轉學習順序，讓學生先在家看資料影片，再來課堂上討論提問。", "isCorrect": true, "rationale": "翻轉教室強調「家裡聽講、教室寫作業（討論）」，將傳統授課流程反轉。"}]},
                {"question": "教育部為導引我國師資培育與教師專業發展，並配合新課綱的內涵，建構新的教師圖像作為教師專業發展的藍圖，此教師圖像稱為終身學習的教師圖像。終身學習的教師圖像分為三大向度，下列何者不是向度的名稱？", "options": [{"text": "教育愛", "isCorrect": false, "rationale": "教育愛是三大向度之一，代表教師對學生的熱忱與關懷。"}, {"text": "專業力", "isCorrect": false, "rationale": "專業力是三大向度之一，代表教師的學術與教學知能。"}, {"text": "未來力", "isCorrect": false, "rationale": "未來力是三大向度之一，代表教師面對未來挑戰的適應與引領能力。"}, {"text": "創新力。", "isCorrect": true, "rationale": "創新力雖然重要，但在教育部官方定義的「終身學習教師圖像」三大向度名稱中並未列為單獨一項。"}]},
                {"question": "自107年開始，有關教育實習的相關規定，以下何者正確？", "options": [{"text": "師資生必須通過教師資格檢定考後使得參與教育實習", "isCorrect": true, "rationale": "自107年起改為「先考後實習」制，師培生需先通過國考檢定再進入學校實習。"}, {"text": "修畢師資職前教育課程，且通過本校教育專業成長時數審查者得以申請實習", "isCorrect": false, "rationale": "這不完整，忽略了最重要的「通過檢定考試」這一門檻。"}, {"text": "教育實習成績之評量統一由實習機構評定", "isCorrect": false, "rationale": "評量通常由師培大學與實習機構共同參與評定，並非單方面決定。"}, {"text": "以上皆非。", "isCorrect": false, "rationale": "選項 ① 是符合現行法規的正確陳述。"}]},
                {"question": "下列何者不是師資培育中心的學生取得教師證書之途徑？", "options": [{"text": "修畢師資職前教育課程", "isCorrect": false, "rationale": "這是取得證書的基礎學歷要求，必須完成。"}, {"text": "通過教師甄試", "isCorrect": true, "rationale": "教師甄試是為了取得「教職（聘約）」，而非取得「教師證書」。"}, {"text": "通過教師資格檢定考試", "isCorrect": false, "rationale": "檢定考試是核發教師證書的必要條件之一。"}, {"text": "修畢教育實習課程。", "isCorrect": false, "rationale": "實習結業並通過成績評定是核發證書的最終步驟。"}]},
                {"question": "我國於 2006 年成為全球第 109 個正式廢除體罰的國家，以保障學生身體自主權，請問零體罰明訂在下列哪項法規中？", "options": [{"text": "教師法", "isCorrect": false, "rationale": "教師法雖規範教師行為，但零體罰的法律母法位階定義首見於基本教育權益規範中。"}, {"text": "兒童及少年福利與權益保障法", "isCorrect": false, "rationale": "這是兒少全面性的福利法規，而非針對校園零體罰的核心母法。"}, {"text": "師資培育法", "isCorrect": false, "rationale": "師培育法關注的是教師如何養成，非校園內對學生的保障規則。"}, {"text": "教育基本法。", "isCorrect": true, "rationale": "2006年修正《教育基本法》，明文規定國家應保障學生不受體罰。"}]},
                {"question": "對於學習成就落後的學生實施補救教學，是十二年國教重要政策方案之一，其主要目的為何？", "options": [{"text": "強化多元文化教育", "isCorrect": false, "rationale": "補救教學側重於基礎學科能力，與多元文化議題屬不同範疇。"}, {"text": "促進教育機會均等", "isCorrect": true, "rationale": "確保每個孩子無論起點高低，都能獲得必要的資源來達成基礎學習目標。"}, {"text": "提供更多就業機會", "isCorrect": false, "rationale": "這是教育的長期成果之一，但非實施「補救教學」的直接核心目的。"}, {"text": "提升菁英教育水準。", "isCorrect": false, "rationale": "補救教學是針對落後者的扶助，與菁英拔尖教育相反。"}]},
                {"question": "根據最新修訂「師資培育之大學及教育實習機構辦理教育實習辦法」，實習學生經師資培育之大學同意，可以在教育實習期間，於機構內擔任補救教學、社團活動指導、監考或其他教學活動，每週累計總節（時）數上限為？", "options": [{"text": "6", "isCorrect": false, "rationale": "此節數低於法定的放寬上限。"}, {"text": "8", "isCorrect": false, "rationale": "此節數尚未達到目前規定的每週總節數上限。"}, {"text": "10", "isCorrect": true, "rationale": "法規規定實習學生在校內擔任特定教學活動之總節數上限為10節。"}, {"text": "12", "isCorrect": false, "rationale": "超過了法規規定的10節上限，會影響實習本務。"}]},
                {"question": "有關我國目前十二年國民基本教育的敘述，下列何者正確？", "options": [{"text": "高級中等教育全面免學費。", "isCorrect": false, "rationale": "雖然現行政策推動免學費，但在敘述上，法律條文的依據更具程序正確性。"}, {"text": "分兩階段，國中小階段依據「教育基本法」，高中職階段依據「高級中等教育法」規定辦理。", "isCorrect": true, "rationale": "這正確描述了現行十二年國教在法源上的階段性區分。"}, {"text": "重視以學生為中心的教學，全面免試，依據國中畢業生之性向、能力和興趣，提供升學的分流選擇。", "isCorrect": false, "rationale": "目前尚未達到「全面免試」，仍有會考等評量與分發機制。"}, {"text": "採均一原則，依據「強迫入學條例」，提供普及、強迫入學的國民教育機會。", "isCorrect": false, "rationale": "強迫入學僅限於前九年的國民義務教育，高中階段並非強迫入學。"}]},
                {"question": "教師期望會影響學生的學習效果。下列的相關敘述何者正確？", "options": [{"text": "教師對學生期望要保持低度標準，減緩學習壓力。", "isCorrect": false, "rationale": "低度期望往往會導致學生成就低下，應該保持的是合適且正向的期待。"}, {"text": "教師一定要瞭解學生，小心運用自我應驗的預言。", "isCorrect": true, "rationale": "自我應驗預言可能產生負面或正面效應，教師應謹慎且具備專業敏感度。"}, {"text": "當學生參與程度較少，可導致學生自我期望較高。", "isCorrect": false, "rationale": "通常參與程度少、獲得肯定少，會降低學生的自我期望。"}, {"text": "比馬龍效應，一定會使學生變成自我概念良好的人。", "isCorrect": false, "rationale": "比馬龍效應是指期望與成果的一致性，並非絕對保證自我概念一定良好。"}]},
                {"question": "未來學校教師除了教學外，尚需針對教學問題進行研究，下列何種研究方法較適合教師使用？", "options": [{"text": "實驗研究法", "isCorrect": false, "rationale": "實驗法需要嚴格控制變因與隨機抽樣，在教學現場操作難度高。"}, {"text": "訪談法", "isCorrect": false, "rationale": "訪談法是具體的技術，但不一定是整套針對「教學改進」的最完整框架。"}, {"text": "行動研究法", "isCorrect": true, "rationale": "行動研究強調在實際教學情境中發現問題、採取行動並反思修正，最適合第一線教師。"}, {"text": "問卷調查法。", "isCorrect": false, "rationale": "這常用於了解現況，但在解決具體課堂教學問題上不若行動研究直接有效。"}]},
                {"question": "家長們關心的「性平」議題，請問依據「性別平等教育法」規定，有關國民中學實施性別平等教育課程、教材與教學，下列敘述何者錯誤？", "options": [{"text": "教材內容應呈現多元之性別觀點", "isCorrect": false, "rationale": "這是性平教育的基本要求，確保學生理解多元差異。"}, {"text": "應利用空白課程進行性別平等教育相關課程或活動", "isCorrect": true, "rationale": "性平教育應融入課程，且法律規定的是每學期固定時數，不應僅依賴「空白課程」。"}, {"text": "學校之課程設置及活動設計不得因性別而有差別待遇", "isCorrect": false, "rationale": "這是防制性別歧視的核心條款。"}, {"text": "每學期至少實施四小時性別平等教育相關課程或活動。", "isCorrect": false, "rationale": "這是性別平等教育法規定的每學期最低實施節數時數。"}]},
                {"question": "學校課程中如重視新移民的原生文化，以展現多元文化的精神，主要在落實何種層面的教育政策？", "options": [{"text": "教育機會均等", "isCorrect": true, "rationale": "透過承認並融入多元文化，讓不同背景的學生都能在教育體系中獲得尊嚴與認同，這也是機會均等的一環。"}, {"text": "社會化", "isCorrect": false, "rationale": "社會化是指個人學習社會規範的過程，範圍較廣。"}, {"text": "社會階層化", "isCorrect": false, "rationale": "社會階層化是指社會地位的分層，教育有時會強化它，而非此政策的主導目的。"}, {"text": "選擇與分配。", "isCorrect": false, "rationale": "這是功能論者看教育的一種角度，與多元文化精神的主動營造較無關。"}]},
                {"question": "根據我國的《教師法》之規定，下列何者不是屬於教師的義務？", "options": [{"text": "擔任導師", "isCorrect": false, "rationale": "依《教師法》，擔任導師是教師受聘後應履行的職務義務之一。"}, {"text": "參加教師組織", "isCorrect": true, "rationale": "參加教師組織（如教師會）是教師的「權利」，而非強制性的「義務」。"}, {"text": "積極維護學生受教之權益", "isCorrect": false, "rationale": "這是教師法明文規定的首要專業義務。"}, {"text": "從事與教學有關之研究、進修。", "isCorrect": false, "rationale": "教師有持續精進專業的法律義務，以確保教學品質。"}]},
                {"question": "行政院提出「2030 雙語國家」政策藍圖，下列何者不包括在此藍圖中？", "options": [{"text": "延伸雙語教學至幼兒園", "isCorrect": false, "rationale": "這是藍圖中推動早發學習環境的一環。"}, {"text": "推動中小學各學科英語授課", "isCorrect": true, "rationale": "藍圖並非要求「所有學科」都英語授課，而是推動部分學科進行雙語教學或增加比重。"}, {"text": "落實中小學英語科全英語授課", "isCorrect": false, "rationale": "這是針對英語學科本身的專業教學要求。"}, {"text": "推動雙聯學位等措施，促進教育體系國際化。", "isCorrect": false, "rationale": "國際化連結是雙語國家藍圖中的重要高等與中等教育策略。"}]},
                {"question": "全國家長最關心的十大教育議題出爐，前十名分別為品格教育是第一名、校園安全和性平、校園霸凌並列第二名，「心理健康」則是第三名。至於考招、課綱議題，則落到第十名。可見家長現在最重視的議題是？", "options": [{"text": "親子關係", "isCorrect": false, "rationale": "雖然重要，但未列在上述統計數據的最前幾名。"}, {"text": "培養孩子正確的價值觀", "isCorrect": true, "rationale": "品格教育排在第一名，反映了家長對核心價值與人際互動品質的極度重視。"}, {"text": "孩子快樂不快樂", "isCorrect": false, "rationale": "這與心理健康相關，但具體名次仍由品格教育居首。"}, {"text": "孩子在學校的成績課業。", "isCorrect": false, "rationale": "統計顯示考招與課綱等成績相關議題排名落後於品格與安全。"}]},
                {"question": "下列關於學校本位課程的陳述，何者為非?", "options": [{"text": "學校自主的課程改革", "isCorrect": false, "rationale": "校本課程核心即是以學校為主體的自主發展。"}, {"text": "由中央負責統籌指導", "isCorrect": true, "rationale": "學校本位課程強調地方與學校的彈性，而非完全由中央單一統籌主導。"}, {"text": "能發揮學校辦學特色", "isCorrect": false, "rationale": "校本課程能讓學校展現出與其他學校不同的在地或特色教育目標。"}, {"text": "結合社區特色發展。", "isCorrect": false, "rationale": "社區資源常是校本課程發展的重要沃土。"}]},
                {"question": "陳老師很樂於學習新的教學方法與評量方法，且將所學到的新式教學方式與評量方法，應用於他自己的課堂教學活動中。請問陳老師的這種作為，符合教育部公布的教育圖像中的哪個向度內涵？", "options": [{"text": "教育愛", "isCorrect": false, "rationale": "教育愛強調關懷與使命，與教學方法的精進雖有聯繫但非核心定義。"}, {"text": "專業力", "isCorrect": false, "rationale": "雖然涉及專業，但官方圖像中對「主動迎接變革與新式挑戰」有更具體的對應向度。"}, {"text": "未來力", "isCorrect": true, "rationale": "未來力包含了持續學習、應對變遷以及帶領學生面對未來挑戰的創新與彈性。"}, {"text": "批判力。", "isCorrect": false, "rationale": "批判力並非官方教師圖像的三大向度名稱。"}]},
                {"question": "請問近年十分熱門的AI人工智慧科技在教育中的角色是什麼？", "options": [{"text": "取代教師的角色", "isCorrect": false, "rationale": "AI 目前無法取代教師在情感輔導、價值引導與複雜情境中的專業判斷。"}, {"text": "提供更多標準化的學習材料", "isCorrect": false, "rationale": "AI 的強項在於「個性化」而非「標準化」。"}, {"text": "限制學生的創意和思維能力", "isCorrect": false, "rationale": "雖然有誤用風險，但教育目標是透過 AI 激發更多可能。"}, {"text": "輔助教育者，提供更具彈性的學習環境", "isCorrect": true, "rationale": "AI 能作為有力的助教，協助適性教學並優化學習路徑。"}]},
                {"question": "台灣雙語教育期待英文教師扮演的角色，何者有誤？", "options": [{"text": "專業發展者：扮演提昇校長、行政與學科教師基本英語能力的專業發展者。", "isCorrect": false, "rationale": "這是英文老師協助全校雙語環境建構的重要專業責任。"}, {"text": "同步翻譯者：為避免學生拒絕雙語教育，教師若以英語講述一段內容後，應將英文翻成國語再講一次。", "isCorrect": true, "rationale": "這會導致學生依賴母語而不去聆聽英語，不符合雙語教學的語言習得原則。"}, {"text": "經驗分享者：提供學科教師在雙語教學之相關經驗。", "isCorrect": false, "rationale": "跨學科的溝通與經驗共享是推動成功的關鍵。"}, {"text": "專業陪伴者：與學科教師共備，提供雙語教學教案與教學策略之專業諮詢。", "isCorrect": false, "rationale": "陪伴非英語專長的教師進行共備是雙語政策推行的重要角色。"}]},
                {"question": "學校輔導是一種專業的助人過程，輔導目標不僅在協助當事人解決問題，也培養當事人獨立面對問題解決的能力，發揮自我潛能。輔導工作有其原則，下列那個原則最不適切？", "options": [{"text": "每位導師都需要負責輔導工作", "isCorrect": false, "rationale": "導師是第一線發現與介入學生問題的核心人物。"}, {"text": "輔導不能獨立於教學活動之外", "isCorrect": false, "rationale": "輔導應與教學相輔相成，融入整體教育情境。"}, {"text": "科任教師也需要負責輔導工作", "isCorrect": false, "rationale": "全體教職員皆有責任參與三級預防中的初級輔導。"}, {"text": "輔導主要工作事項為學習輔導。", "isCorrect": true, "rationale": "輔導範疇包含生活、心理、生涯等多方面，不能窄化為僅限於學習成績輔導。"}]},
                {"question": "下列有關課程、教材與教科書的關係描述,何者有誤?", "options": [{"text": "教材是課程的一部分。", "isCorrect": false, "rationale": "這是正確的層級概念，課程包含計畫與實施媒介（教材）。"}, {"text": "教科書和教材互不包含。", "isCorrect": true, "rationale": "教科書是教材中最常見、最主要的類型，它是被教材範疇所包含的。"}, {"text": "教師製作影片、簡報屬於教材。", "isCorrect": false, "rationale": "凡是能傳遞課程內容的媒介工具都屬於教材範疇。"}, {"text": "教科書或教材能反映課程的目標。", "isCorrect": false, "rationale": "教材應根據課程綱要與目標進行編寫與選擇。"}]},
                {"question": "依據最新修訂《校園霸凌防制準則》，下列說明何者有誤？", "options": [{"text": "「霸凌」指個人或集體持續以言語、文字、肢體等方式對他人故意為貶抑、排擠，使人受損害之行為。", "isCorrect": false, "rationale": "這是準則中對霸凌核心要素（持續性、故意性、敵意環境）的準確描述。"}, {"text": "教職員工知有疑似校園霸凌事件時，均應立即通報，至遲不得超過二十四小時。", "isCorrect": false, "rationale": "法規規定的校安通報時限確實為 24 小時。"}, {"text": "「校園霸凌」指相同或不同學校校長及教師、職員、工友、學生對學生，於校園內所發生之霸凌行為。", "isCorrect": true, "rationale": "最新準則已區分學生對學生（霸凌）與師對生（屬其他管教或不當對待範疇），此定義已修正。"}, {"text": "疑似校園霸凌事件之被霸凌人或其法定代理人，得向行為人於行為發生時所屬之學校申請調查。", "isCorrect": false, "rationale": "這是合法的救濟與申訴程序規定。"}]},
                {"question": "根據法規：高級中等學校學生未經請假或不明原因未到校上課連續達三日以上者稱為何種類型學生？", "options": [{"text": "中途輟學學生(中輟生)", "isCorrect": false, "rationale": "中輟生主要是針對國中小義務教育階段的術語。"}, {"text": "中途離校學生(中離生)", "isCorrect": true, "rationale": "高中職階段學生無故缺課達三日，法規定義為「中途離校學生」。"}, {"text": "長期缺課學生(長缺生)", "isCorrect": false, "rationale": "這是一般口語描述，非法律上的正式類型名稱。"}, {"text": "不明原因學生(不明生) 。", "isCorrect": false, "rationale": "這非法律正式術語。"}]},
                {"question": "一位教師想知道創新教學策略是否比傳統策略更為有效，選出二個具有相同能力的班級。一班使用新教學策略，另一班使用傳統教學策略，然後比較二個班級的學習成效。這位教師使用的是那一種研究類型？", "options": [{"text": "實驗法", "isCorrect": true, "rationale": "透過操弄獨立變項（教學法）並觀察依變項（學習成效），這是標準的實驗設計。"}, {"text": "研究法", "isCorrect": false, "rationale": "這是一個概括性名詞，不足以精確描述具體的實作設計。"}, {"text": "相關法", "isCorrect": false, "rationale": "相關法僅探討兩者間的關聯，不涉及主動的操作介入與因果探討。"}, {"text": "描述法。", "isCorrect": false, "rationale": "描述法僅針對現狀進行觀察與陳述，無涉及不同策略的成效比較。"}]},
                {"question": "「十二年國教」試圖將國小六年、國中與高中各三年的學校教育進行整體性規劃，延伸既有之九年國民義務教育，以提高我國國民素質，請問此「六三三」學制是仿效下列哪個國家？", "options": [{"text": "日本", "isCorrect": false, "rationale": "雖然日本也使用此學制，但近代台灣學制的起源主要源自另一強權。"}, {"text": "美國", "isCorrect": true, "rationale": "台灣近代學制深受美國教育體系影響，包含六三三的分段模式。"}, {"text": "英國", "isCorrect": false, "rationale": "英國學制分段與我國傳統的六三三有較大差異。"}, {"text": "德國。", "isCorrect": false, "rationale": "德國學制分流極早，與台灣的通才式六三三學制結構不同。"}]},
                {"question": "近年來，社會大眾相當關切偏鄉國中生的高中會考成績偏低情況，此問題主要涉及到下列哪個重要的教育議題？", "options": [{"text": "終身學習能力", "isCorrect": false, "rationale": "雖然終身學習重要，但成績落差的核心問題於基礎教育資源不公。"}, {"text": "教師專業能力", "isCorrect": false, "rationale": "雖然與教師有關，但偏鄉困境更多是環境、資源與機會的問題。"}, {"text": "教育機會均等", "isCorrect": true, "rationale": "城鄉差距造成的學習表現落差是違反教育機會均等的核心挑戰。"}, {"text": "家長教育選擇權。", "isCorrect": false, "rationale": "家長選擇權側重於多元辦學選擇，非指成績落差問題。"}]},
                {"question": "雙語教育在臺灣的教育現場已成為趨勢，有關台灣雙語教育目前推動的重點，何者有誤？", "options": [{"text": "全校教職員均有責任建置學校雙語環境，校長應率先使用雙語。", "isCorrect": false, "rationale": "領導者的模範帶動是營造雙語環境的官方建議策略。"}, {"text": "英語教學是在為學生的英語能力打底，學生具備基礎英語能力後，有可能接受雙語教育。", "isCorrect": false, "rationale": "這符合學生認知與語言習得的循序漸進邏輯。"}, {"text": "授課教師採用課室英語，學科內容可以國語授課。", "isCorrect": false, "rationale": "這是目前推動雙語教學中一種常見且務實的混合模式。"}, {"text": "目前臺灣雙語教育推動最理想狀況是增能英語教師的學科知識，使其能在課堂中使用兩種語言襤教學。", "isCorrect": true, "rationale": "最理想與推動的核心方向應是「增能學科教師的英語力」，而非要求英文老師去教專業學科。"}]},

        const container = document.getElementById('quiz-container');
        let answeredCount = 0;

        function renderQuiz() {
            quizData.questions.forEach((q, qIdx) => {
                const qDiv = document.createElement('div');
                qDiv.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-200 transition-all";
                
                const optionsHtml = q.options.map((opt, oIdx) => `
                    <label class="option-label flex items-start p-4 mb-3 rounded-xl border-2 border-slate-50 cursor-pointer transition-all hover:border-blue-100">
                        <input type="radio" name="q${qIdx}" class="mt-1.5 h-4 w-4 text-blue-600 focus:ring-blue-500" 
                               onclick="handleAnswer(${qIdx}, ${oIdx})">
                        <span class="ml-3 text-slate-700 leading-relaxed font-medium">${opt.text}</span>
                    </label>
                `).join('');

                qDiv.innerHTML = `
                    <div class="flex items-start mb-5">
                        <span class="bg-blue-600 text-white text-xs font-black px-2.5 py-1 rounded-md mr-3 mt-1">Q${qIdx + 1}</span>
                        <h3 class="text-lg font-bold text-slate-800 leading-relaxed">${q.question}</h3>
                    </div>
                    <div class="space-y-1">${optionsHtml}</div>
                    <div id="feedback-${qIdx}" class="mt-5 hidden p-5 rounded-xl text-sm leading-relaxed font-medium shadow-inner"></div>
                `;
                container.appendChild(qDiv);
            });
        }

        window.handleAnswer = function(qIdx, oIdx) {
            const question = quizData.questions[qIdx];
            const option = question.options[oIdx];
            const feedbackDiv = document.getElementById(`feedback-${qIdx}`);
            const inputs = document.getElementsByName(`q${qIdx}`);
            
            inputs.forEach(input => input.disabled = true);

            feedbackDiv.classList.remove('hidden');
            if (option.isCorrect) {
                feedbackDiv.classList.add('correct-answer', 'border');
                feedbackDiv.innerHTML = `<div class="flex items-center mb-1"><span class="text-xl mr-2">✅</span><span class="text-base font-bold">答對了！</span></div><p class="pl-8">${option.rationale}</p>`;
            } else {
                feedbackDiv.classList.add('wrong-answer', 'border');
                feedbackDiv.innerHTML = `<div class="flex items-center mb-1"><span class="text-xl mr-2">❌</span><span class="text-base font-bold">不正確</span></div><p class="pl-8">${option.rationale}</p>`;
            }

            answeredCount++;
            if (answeredCount === quizData.questions.length) {
                const summaryDiv = document.getElementById('final-summary');
                document.getElementById('summary-content').innerText = quizData.summary;
                summaryDiv.classList.remove('hidden');
                summaryDiv.scrollIntoView({ behavior: 'smooth' });
            }
        };

        document.addEventListener('DOMContentLoaded', renderQuiz);
    </script>
